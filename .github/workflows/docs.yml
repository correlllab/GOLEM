name: Docs

# Build the MkDocs site (mkdocs build --strict) on every pull request and push to main
# that touches the docs; deploy it to GitHub Pages from main once Pages is enabled.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One run per ref at a time; a deploy in progress is never cancelled.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements-docs.txt
      - name: Install docs requirements
        run: pip install -r docs/requirements-docs.txt
      # --strict fails the build on a broken link or a page missing from the nav.
      - name: Build site
        run: mkdocs build --strict
      # Pages is a repository setting (Settings > Pages > Source: GitHub Actions) that only
      # an admin can turn on; until then the site is built and checked but not deployed.
      - name: Check that GitHub Pages is enabled
        id: pages
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages")
          case "$status" in
            200) echo 'enabled=true' >> "$GITHUB_OUTPUT" ;;
            404) echo 'enabled=false' >> "$GITHUB_OUTPUT"
                 echo '::notice::GitHub Pages is not enabled for this repository; the site is not deployed.' ;;
            *)   echo "::error::GET /pages returned HTTP $status"; exit 1 ;;
          esac
      - uses: actions/upload-pages-artifact@v5
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.pages == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
