[project]
name = "golem-native-ros"
version = "0.0.0"
description = "Native ROS 2 Humble Python library environment"
requires-python = ">=3.10,<3.11"
dependencies = [
    # ROS/cv_bridge require NumPy 1; controller NumPy 2 dependencies are separate.
    "numpy==1.26.4",
    "scipy==1.13.1",
    "PyYAML==6.0.2",
    "pyserial==3.5",
    "cyclonedds==0.10.2",
    # Humble ament_python uses setup.py develop/install.
    "setuptools==59.6.0",
    "wheel==0.43.0",
]

[tool.uv]
package = false
