[project]
name = "g1-control"
version = "0.1.0"
description = "Controller of the h12 robot with ROS2 services"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.10.8",
    "meshcat>=0.3.2",
    "meshcat-shapes>=1.0.0",
    "meshio>=5.3.5",
    "numpy>=2.2.6",
    "ompl>=1.7.0",
    "open3d>=0.19.0",
    "opencv-python>=4.13.0.92",
    "pin>=3.9.0",
    "pin-pink>=4.1.0",
    "pynput>=1.8.1",
    "pyquaternion>=0.9.9",
    "pyvista>=0.47.1",
    "qpsolvers[clarabel,cvxopt,daqp,ecos,highs,osqp,piqp,qpalm,qpax,quadprog,scs,sip]>=4.10.0",
    "scipy>=1.15.3",
    "tqdm>=4.67.3",
    "unitree-sdk2py",
]

[tool.uv.workspace]
members = [
    "../../../../unitree_sdk2_python",
]

[tool.uv.sources]
unitree-sdk2py = { workspace = true, editable = true }
