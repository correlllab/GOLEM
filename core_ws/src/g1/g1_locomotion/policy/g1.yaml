# HOMIE's G1 walking policy in MuJoCo. Values follow HOMIE's training config
# (HomieRL g1_29dof_config.py and legged_robot_config.py) unless noted.
# Paths are relative to this file.

policy_path: deploy.onnx
xml_path: ../CL_Assets/g1/g1_description/g1_29dof_with_hand_rev_1_0.xml

# Simulation parameters
simulation_duration: 60.0
simulation_dt: 0.002
control_decimation: 10  # policy at 50 Hz, as in training (dt 0.005 x decimation 4)

# The 27 joints the policy observes, in its order: the 29 body joints minus
# waist roll and waist pitch. The first num_actions (the legs) are its outputs.
policy_joints: [
  left_hip_pitch_joint, left_hip_roll_joint, left_hip_yaw_joint,
  left_knee_joint, left_ankle_pitch_joint, left_ankle_roll_joint,
  right_hip_pitch_joint, right_hip_roll_joint, right_hip_yaw_joint,
  right_knee_joint, right_ankle_pitch_joint, right_ankle_roll_joint,
  waist_yaw_joint,
  left_shoulder_pitch_joint, left_shoulder_roll_joint, left_shoulder_yaw_joint,
  left_elbow_joint, left_wrist_roll_joint, left_wrist_pitch_joint, left_wrist_yaw_joint,
  right_shoulder_pitch_joint, right_shoulder_roll_joint, right_shoulder_yaw_joint,
  right_elbow_joint, right_wrist_roll_joint, right_wrist_pitch_joint, right_wrist_yaw_joint,
]
num_actions: 12
obs_history_len: 6

# Default joint angles for legs; every other joint is held at 0
default_angles: [-0.1, 0.0, 0.0, 0.3, -0.2, 0.0,
                 -0.1, 0.0, 0.0, 0.3, -0.2, 0.0]

# PD gains, matched to joint names by substring as in training. Waist roll,
# waist pitch and the hands were locked in HOMIE's sim; here they are actuated
# and held at 0 (the hands with the config's otherwise unused hand gains).
stiffness: {hip_yaw: 100, hip_roll: 100, hip_pitch: 100, knee: 150, ankle: 40,
            waist: 300, shoulder: 200, elbow: 100, wrist: 20, hand: 10}
damping: {hip_yaw: 2, hip_roll: 2, hip_pitch: 2, knee: 4, ankle: 2,
          waist: 5, shoulder: 4, elbow: 1, wrist: 0.5, hand: 2}

# HOMIE's MJCF gives every joint these; Unitree's model in CL_Assets/g1 has none
joint_damping: 0.001
joint_armature: 0.01
joint_frictionloss: 0.1

# Scaling factors
ang_vel_scale: 0.5          # HOMIE's MuJoCo script had 0.25
dof_pos_scale: 1.0
dof_vel_scale: 0.05
action_scale: 0.25
cmd_scale: [2.0, 2.0, 0.5]  # HOMIE's deploy scripts had 0.25 for yaw
clip_actions: 100.0

# Initial commands: vx, vy (m/s), yaw rate (rad/s)
cmd_init: [0.0, 0.0, 0.0]
# Pelvis height target (m); 0.74 is standing. HOMIE's MuJoCo config had 0.34,
# a deep squat.
height_cmd: 0.74
# The ranges HOMIE was trained on, as [min, max]; clip_command() clips to them
cmd_range: [[-0.8, 1.2], [-0.5, 0.5], [-0.8, 0.8]]  # vx, vy, yaw
height_range: [0.24, 0.74]
