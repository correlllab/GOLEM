# FAST_LIO on the G1 sim's MID-360: /livox/lidar (livox_ros_driver2/CustomMsg,
# 10 Hz) and /livox/imu (sensor_msgs/Imu, 200 Hz), both in livox_frame, the
# sensor's own frame, which is upside down on the G1.
#
# FAST_LIO names its frames camera_init (the IMU's start pose) and body (the
# IMU). g1_navigation.launch.py hangs them off odom with a static transform it
# computes from the URDF and from mapping.extrinsic_T/R below
# (g1_navigation/frames.py), and off the pelvis with body_to_pelvis, which reads
# the same extrinsic. Edit the extrinsic here, not there.
/**:
    ros__parameters:
        feature_extract_enable: false
        point_filter_num: 1          # keep every point: a synthetic scan is sparser than the real one
        max_iteration: 3
        # 0.2 m voxels left FAST_LIO 5 cm off on test_fastlio.py's synthetic scan,
        # 0.1 m about 1 cm; check again on the G1 sim's scans
        filter_size_surf: 0.1
        filter_size_map: 0.1
        cube_side_length: 1000.0
        runtime_pos_log_enable: false
        map_file_path: ""

        common:
            lid_topic: "/livox/lidar"
            imu_topic: "/livox/imu"
            time_sync_en: false
            time_offset_lidar_to_imu: 0.0

        preprocess:
            lidar_type: 1            # Livox CustomMsg (FAST_LIO's AVIA path)
            scan_line: 6             # FAST_LIO drops points with line >= scan_line; the MID-360 has 4
            blind: 0.7               # m from the lidar; the arm and hand meshes in 'home' are 0.38-0.57 m away
            timestamp_unit: 3        # unused for CustomMsg (offset_time is in ns)
            scan_rate: 10

        mapping:
            acc_cov: 0.1
            gyr_cov: 0.1
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            fov_degree: 360.0
            det_range: 100.0
            # The MID-360's lidar origin in its own IMU's frame (p_imu = R p_lidar + T):
            # FAST_LIO's upstream MID-360 value, which the sim has to match. R is
            # identity for the raw sensor frame. Not estimated online: the launch
            # file's static transforms use these values.
            extrinsic_est_en: false
            extrinsic_T: [-0.011, -0.02329, 0.04412]
            extrinsic_R: [1., 0., 0.,
                          0., 1., 0.,
                          0., 0., 1.]

        publish:
            path_en: true
            effect_map_en: false
            map_en: false            # /Laser_map, the whole map every second; on only to inspect
            scan_publish_en: true
            dense_publish_en: false
            scan_bodyframe_pub_en: true

        pcd_save:
            pcd_save_en: false
            interval: -1
