# Simulated G1 (RoboCasa), default: our controller drives waist + arms over rt/arm_sdk while
# Unitree's controller keeps the legs balanced.
#
# Nothing is published until an upper-body command passes the engage gate
# (below); the weight slot (motor 29) then ramps 0 -> 1 over engage_seconds. On
# estop, and on SIGINT/SIGTERM/SIGHUP, the last good command is held while the
# weight ramps back to 0 over release_seconds, handing waist + arms back to
# Unitree. The estop stays latched until restart.
# Estop limits are relaxed so sim contact spikes do not latch it; as a sim
# config it refuses DDS domain 0, the real robot.
robot: sim
mode: arm_sdk_mode

topics:
  low_cmd_upper_in: rt/safety/lowcmd_upper_in
  low_cmd_out: rt/arm_sdk
  low_state: rt/lowstate

network:
  domain_id: 1
  interface: ''

control:
  publish_hz: 500.0
  # once engaged, longest gap allowed on rt/lowstate; relaxed because the sim
  # can run slower than real time, while the watchdogs measure real time
  state_stale_estop_seconds: 1.0

# start only when rt/lowstate is fresh (relaxed like the watchdogs: the sim
# can run slower than real time) and reports mode_machine 5, as the sim's G1
# does, and the command is within max_position_error of the measured q
engage:
  max_state_age_seconds: 1.0
  mode_machine: 5
  # rad
  max_position_error: 0.15

arm_sdk:
  engage_seconds: 1.0
  release_seconds: 1.0
  # a command with a waist (slots 12-14) kp below this latches the estop
  waist_kp_min: 40.0

limits:
  # all fields can be scalar or 29-entry lists (rt/lowcmd slot order) for
  # per-joint tuning; ratios scale the URDF limits in g1_description
  # starting values, not yet tuned on our G1
  clip:
    position_offset: 0.01
    velocity_ratio: 0.10
    torque_ratio: 0.60
    kp_max: 200.0
    kd_max: 10.0
  # checked on waist + arms (slots 12-28) only, and only once engaged
  estop:
    position_offset: -0.01
    velocity_ratio: 2.0
    torque_ratio: 2.0

logging:
  enabled: true
  # G1_SAFETY_LOG_DIR, when set, overrides this (one subdirectory per run)
  base_dir: /tmp/g1_safety_layer
  chunk_prefix: chunk_
