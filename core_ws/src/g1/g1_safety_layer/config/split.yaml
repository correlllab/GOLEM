# Real G1, full body on rt/lowcmd: legs (slots 0-11) from a lower-body
# controller, waist + arms (12-28) from the upper-body controller, merged here.
# Unitree's controller must be released first (motion_switcher); on estop every
# motor is zeroed or damped (see estop_response).
# Nothing is published until both inputs have sent a command and the merged
# command passes the engage gate (below), and rt/lowstate is checked only from
# then on. Each watchdog starts at its own input's first command: the estop
# latches if the lower input then goes quiet for lower_stale_estop_seconds, or
# the upper input for 2 s, or, once engaged, rt/lowstate for
# state_stale_estop_seconds. SIGINT/SIGTERM/SIGHUP write the estop command,
# then exit.
robot: real
mode: split_mode

topics:
  low_cmd_lower_in: rt/safety/lowcmd_lower_in
  low_cmd_upper_in: rt/safety/lowcmd_upper_in
  low_cmd_out: rt/lowcmd
  low_state: rt/lowstate

network:
  domain_id: 0
  interface: ''

control:
  publish_hz: 500.0
  # longest gap allowed on the lower input (10 periods of a 50 Hz walking policy)
  lower_stale_estop_seconds: 0.2
  # once engaged, longest gap allowed on rt/lowstate (500 Hz on the robot)
  state_stale_estop_seconds: 0.1

# start publishing only when rt/lowstate is fresh and reports our unit's
# mode_machine, and the command is within max_position_error of the measured q
# on all 29 slots, so the take-over cannot jump
engage:
  max_state_age_seconds: 0.1
  mode_machine: 5
  # rad
  max_position_error: 0.15

# the rt/lowcmd estop command. zero: every motor off, so the robot drops and
# must be supported (e.g. on a gantry). damp: every motor stays enabled with
# kp = 0, q = dq = tau = 0 and the kd below, so it sinks instead of dropping
estop_response:
  mode: zero
  # used by damp only: scalar or 29-entry list, at most limits.clip.kd_max;
  # a starting value, not yet tuned on our G1
  kd: 8.0

limits:
  # all fields can be scalar or 29-entry lists (rt/lowcmd slot order) for
  # per-joint tuning; ratios scale the URDF limits in g1_description
  # untuned placeholders: set these with the lower-body controller
  clip:
    position_offset: 0.01
    velocity_ratio: 0.10
    torque_ratio: 0.60
    kp_max: 200.0
    kd_max: 10.0
  estop:
    position_offset: 0.0
    velocity_ratio: 0.50
    torque_ratio: 0.90

logging:
  enabled: true
  # G1_SAFETY_LOG_DIR, when set, overrides this (one subdirectory per run)
  base_dir: /tmp/g1_safety_layer
  chunk_prefix: chunk_
