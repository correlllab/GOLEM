# Nav2 (Humble 1.1) for the G1: Smac 2D plans on the SLAM map, Regulated Pure
# Pursuit follows the path, and the velocity smoother publishes /cmd_vel for the
# walking node. Frames: map (slam_toolbox, the identity) -> odom -> pelvis.
# robot_base_frame is base_footprint (level_frame: the pelvis's x, y and heading
# on odom's floor), so the robot's tilt does not enter Nav2. RPP works in the
# robot's base frame, the goal checker on x, y in odom. In the tilted pelvis
# frame a goal on the floor moves by its depth below the pelvis x sin(tilt), and
# test_nav2_smoke.py's goal did not finish within 150 s in 3 of 8 runs (README "Nav2").
#
# Speed caps (accepted by the user): vx -0.3..0.5 m/s, vy 0, |wz| <= 0.6 rad/s.
# The velocity smoother enforces them. The launch file routes the controller's
# and the recovery behaviors' commands through it, so it is the only publisher
# of /cmd_vel.
#
# Costmap layer parameters sit directly under the layer's name. A
# ros__parameters level there hides them, and Nav2 silently falls back to its
# defaults.
#
# use_sim_time comes from the launch file.

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    # behavior trees: nav2_bt_navigator's defaults,
    # navigate_to_pose_w_replanning_and_recovery.xml and
    # navigate_through_poses_w_replanning_and_recovery.xml

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.25
      movement_time_allowance: 15.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: true
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.4          # cruise; the smoother caps vx at 0.5
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: false
      transform_tolerance: 0.2
      use_interpolation: true
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      # slow down in curves so that wz = vx * curvature stays under 0.6 rad/s
      # (0.4 / 0.9 = 0.44) down to a 0.25 m turning radius
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.15
      use_cost_regulated_linear_velocity_scaling: false
      cost_scaling_dist: 0.3
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0
      # turn in place toward the path; never walk backwards on a path
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 0.6
      rotate_to_heading_min_angle: 0.785
      allow_reversing: false
      # RPP limits rotate-to-heading to (odom yaw rate) +- max_angular_accel / 20 Hz.
      # Neither odom source may fill the twist (FAST_LIO publishes none on
      # /odom), so a zero yaw rate would cap turning at 0.16 rad/s with the
      # default 3.2; 12 lets it reach 0.6. The velocity smoother limits the
      # acceleration instead.
      max_angular_accel: 12.0
      max_robot_pose_search_dist: 10.0

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: [GridBased]
    # Smac 2D (A* on the costmap), not NavFn: in the G1 sim's kitchen test NavFn
    # failed to extract a path from its potential ("Failed to create a plan from
    # potential when a legal potential was found") in 4 of 27 runs, 14 times in a
    # row in one, which aborted the goal
    GridBased:
      plugin: nav2_smac_planner/SmacPlanner2D
      tolerance: 0.5
      allow_unknown: true
      downsample_costmap: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      # steers the search away from inflated cells (Nav2's suggested trade-off)
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, drive_on_heading, wait]
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading
    wait:
      plugin: nav2_behaviors/Wait
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.6
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.0

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.5, 0.0, 0.6]    # vx, vy, wz: the caps
    min_velocity: [-0.3, 0.0, -0.6]
    # inside g1_homie's own rate limits (0.5 m/s^2, 1.0 rad/s^2)
    max_accel: [0.4, 0.0, 0.8]
    max_decel: [-0.5, 0.0, -1.0]
    deadband_velocity: [0.0, 0.0, 0.0]
    # no input for 0.3 s (6 controller or 3 behavior cycles): ramp to zero at
    # max_decel, then stop publishing. Short, so that a dead controller or
    # behavior stops the robot instead of the smoother holding its last command
    # for long; once the smoother goes quiet, the walking node's own 0.5 s
    # stale-command timeout holds it at zero.
    velocity_timeout: 0.3
    odom_topic: odom
    odom_duration: 0.1

# Footprint, in the pelvis frame: the walking robot with the arms in the arm
# controller's 'home' pose. In the G1 sim's kitchen test (test_sim_nav.sh), the
# bounding boxes of the robot's collision geoms reached, from the pelvis and
# along its heading, x -0.190 m (the swing feet; the torso -0.155) to +0.435 m
# (the Dex3 fingers) and y +-0.238 m (the elbows) while walking, and x -0.124 to
# +0.426 m, y +-0.221 m standing. The footprint covers that: x -0.20 to 0.44 m,
# y +-0.24 m. The scan's range_min (0.50 m) has to stay beyond the hands (0.445 m
# horizontally from the pelvis in 'home', by FK of the URDF): it is what drops
# the robot's own arms from the scan. Navigate with the arms in 'home'.
#
# Each obstacle layer expects a scan at least every 0.5 s
# (expected_update_rate): with a dead or lagging scan path the costmap stops
# being current, and the controller and planner wait instead of driving on
# stale obstacles.
local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_footprint
      update_frequency: 5.0
      publish_frequency: 2.0
      transform_tolerance: 0.3
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      footprint: "[[0.44, 0.24], [0.44, -0.24], [-0.20, -0.24], [-0.20, 0.24]]"
      always_send_full_costmap: true
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          # the scan lies at pelvis height, 0.71-0.78 m in odom
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          # no return (inf) clears nothing: an obstacle inside the scan's 0.50 m
          # range_min shows as no return, and must stay marked
          inf_is_valid: false
          expected_update_rate: 0.5
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.55
        cost_scaling_factor: 3.0

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_footprint
      # 5 Hz: a replan after a costmap-clearing recovery waits for the next update
      update_frequency: 5.0
      publish_frequency: 1.0
      transform_tolerance: 0.3
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.44, 0.24], [0.44, -0.24], [-0.20, -0.24], [-0.20, 0.24]]"
      always_send_full_costmap: true
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          # map -> odom is the identity, so the scan lies at pelvis height in map
          # too. While it carried the pelvis's tilt, 43-59% of the returns within
          # 2.5 m lay below 0 here and were dropped (README "slam_toolbox")
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          inf_is_valid: false
          expected_update_rate: 0.5
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.55
        cost_scaling_factor: 3.0
