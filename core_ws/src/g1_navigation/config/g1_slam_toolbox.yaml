# slam_toolbox (online async mapping) for the G1: draws the 2D /map from /scan,
# each scan placed where the odometry (FAST_LIO, or the sim's ground truth in
# sim_gt) has the robot, for Nav2 and the frontier explorer (frontier_explore,
# its unknown cells). It does not localise: no scan matching, no loop closing
# (Mapper, below). Its map -> odom puts base_frame at z = 0 and level in map at
# each scan it adds. base_frame is base_footprint (level_frame: pelvis_level on
# odom's floor), which already is that in odom, so map -> odom is the identity
# (within 0.1 mm and 0.002 deg in 11 of the G1 sim's nav and exploration runs) and
# a pose in odom is the same pose in map. With base_frame pelvis it carried the
# pelvis's height and tilt at the last scan (z -1.24..-0.03 m, tilt up to 8.7
# deg): the floor under the pelvis landed up to 10.9 cm off in map, and the
# scan lay tilted about z = 0 there, so the global costmap's obstacle layer
# (min_obstacle_height 0.0 in map) dropped 43-59% of the returns within 2.5 m
# (README "slam_toolbox").
# Started from the H1's slam_toolbox_h1.yaml. The frames are the G1's own: odom
# is level, with the floor at z = 0, in both odom sources. use_sim_time comes
# from the launch file.
slam_toolbox:
  ros__parameters:

    # Solver
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    odom_frame: odom
    map_frame: map
    # pelvis_level on the floor (level_frame): level and at z = 0 in odom, so
    # map -> odom is the identity (above)
    base_frame: base_footprint
    scan_topic: /scan
    use_map_saver: true
    mode: mapping

    # Walking at <= 0.5 m/s with 10 Hz scans: add scans often (the upstream
    # 0.5 m / 0.5 rad adds one every 2+ s at this speed).
    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.05
    map_update_interval: 1.0
    resolution: 0.05
    min_laser_range: 0.50            # the scan's range_min
    max_laser_range: 8.0             # the scan's range_max
    minimum_time_interval: 0.2
    # map -> odom is stamped with the last scan's stamp plus this. A scan reaches
    # slam_toolbox 0.1-0.25 s after its stamp, so with 0.2 map -> odom lagged the
    # sim's ground-truth odom -> pelvis (sim_gt) by up to 68 ms, and RPP, which
    # transforms at the robot pose's stamp, waited or failed: 3-42 missed 20 Hz
    # control cycles a run in the G1 sim's kitchen test, and once 4 aborted
    # FollowPaths. With 0.3, none in 8 runs. FAST_LIO's odom lags 26-120 ms, so
    # fastlio mode was fine either way.
    transform_timeout: 0.3
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: false

    # Mapper
    # Off: the odometry places each scan, slam_toolbox only draws the map. In the
    # G1 sim's kitchen, on the 7.6-7.7 m walk into the corridor behind the
    # counter peninsula (fastlio, 4 runs), scan matching moved map -> pelvis
    # 15-18 cm across the corridor and up to 2.6 deg in yaw while FAST_LIO's
    # odom -> pelvis stayed within 0.6 cm, and the map drew the counter's edge
    # up to 0.21 m off (README "slam_toolbox"). Off in both odom sources: each
    # places the scans better. Karto then builds no pose graph, so the scan
    # matcher's and loop closure's parameters (most of this section and the
    # three below) do nothing.
    use_scan_matching: false
    use_scan_barycenter: true
    minimum_travel_distance: 0.10
    minimum_travel_heading: 0.10
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    # Off too: Karto closes loops on the scan matcher's pose graph only, so it
    # would do nothing; and a closure would move map -> odom off FAST_LIO's frame,
    # in which the robot's poses are kept (spatial memory's too).
    do_loop_closing: false
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # Correlation
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Loop closure
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Scan matcher
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
