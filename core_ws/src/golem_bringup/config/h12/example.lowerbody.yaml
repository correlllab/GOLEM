# Every parameter of golem_lowerbody_rl's lowerbody_controller_node, the keys
# lowerbody_real.yaml and lowerbody_sim.yaml set, with the node's defaults. No launch
# file loads this file. The node's module docstring has its phases (wait, pre-pose,
# hold, run, fault).
lowerbody_controller_node:
  ros__parameters:
    # Hz, the policy and command rate.
    control_hz: 50.0
    # The policy for the whole run: fame (stands and squats), walk or almi (both follow
    # /cmd_vel), or none (the legs stay uncommanded). h12_lowerbody.launch.py sets it
    # from lowerbody:=.
    active_policy: fame
    # Each policy's config file (path). The defaults are these files in
    # golem_lowerbody_rl's share directory.
    walk_config: policies/walk/walk.yaml
    fame_config: policies/fame/fame.yaml
    almi_config: policies/almi/almi.yaml
    # deg, the IMU's reading with the torso level: positive pitch reads tilted forward,
    # positive roll tilted right. Applied to every /lowstate sample before the policy
    # and the upright and fall checks; settable live (ros2 param set, rqt_reconfigure)
    # within -15 to 15.
    imu_offset_roll_deg: 0.0
    imu_offset_pitch_deg: 0.0
    imu_offset_yaw_deg: 0.0
    # The policy's height command at engage, in the policy's own units.
    default_height_cmd: 1.0
    # s, the ramp of the pre-pose target from the measured leg pose to the policy's
    # crouch (cosine blend); 0 steps straight to the crouch.
    prepose_ramp_s: 2.0
    # true: hold the crouch until /lowerbody/confirm_engage (the real robot); false:
    # engage once the pre-pose settles (unattended sim runs).
    engage_wait_for_confirm: true
    # true: the sim's elastic band holds the robot and the node releases it through
    # /elastic_band/toggle once the policy runs; false: there is no band (real robot).
    disable_elastic_band: true
    # true: release the band only once band_release_topic has a message, which
    # frame_task_server publishes after its start-up moves; an earlier release drops
    # the robot.
    band_wait_for_frame_task: true
    # The geometry_msgs/PoseStamped topic whose first message allows the release.
    band_release_topic: /left_ee_pose
    # s (wall clock) from the node's start after which the band is released without
    # band_release_topic.
    band_max_wait: 30.0
    # s of /safety/heartbeat silence, after the first beat, that stops the node for
    # good. The heartbeat runs at 10 Hz, so 0.5 s is five missed beats.
    heartbeat_timeout: 0.5
    # s (wall clock), the longest gap between /lowstate callbacks once the legs are
    # commanded before the node stops for good.
    max_state_gap: 0.25
    # s, a /cmd_vel older than this is zero velocity.
    cmd_vel_timeout: 0.5
