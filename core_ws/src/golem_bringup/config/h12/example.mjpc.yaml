# Every ROS parameter of deploy_mjpc's three nodes, the keys mjpc_real.yaml and
# mjpc_sim.yaml set, with the nodes' defaults. No launch file loads this file. Each node
# maps its parameters to the flags of a script or binary from the mujoco_mpc submodule
# and runs it: the estimator's mjpc/deploy/helper_scripts/base_estimator_node.py, the
# visualizer's plan_visualizer.py beside it, and the controller cores' ABSL flags
# (mjpc/deploy/h12_lower_body_controller.cc), whose help texts are the long reference.

# estimator_node: the RW-EKF (or complementary) leg-odometry and IMU base estimator,
# publishing SportModeState_ over Unitree DDS.
deploy_mjpc_estimator:
  ros__parameters:
    # The fork's estimator script (path); default under $MJPC_ROOT (/home/code/mujoco_mpc).
    estimator_script: ""
    # The MuJoCo model the estimator's kinematics use (path); default the staged
    # Stabilize_H12_Magpie.xml task.
    scene: ""
    # DDS domain; default $ROS_DOMAIN_ID, else 0.
    domain_id: 0
    # NIC to pin; "" picks the one on the robot subnet (192.168.123.x).
    iface: ""
    # true: let the SDK choose the NIC (a twin on the same host).
    no_auto_iface: false
    # Hz, the publish rate.
    rate: 200.0
    # s of plant time per /lowstate tick; 0 clocks the filter on the wall clock (the
    # real robot). A slower-than-real-time sim passes its physics step.
    tick_dt: 0.0
    # The input topic (unitree_hg LowState_).
    lowstate_topic: rt/lowstate
    # The output topic; rt/sportmodestate_est keeps the estimator off the robot's own.
    out_topic: rt/sportmodestate_est
    # ms, the low-pass time constant of the vertical leg-odometry velocity.
    vel_lpf_ms: 30.0
    # true: fuse IMU acceleration into the horizontal base velocity; false: leg
    # odometry only.
    imu_fusion: true
    # ms, the window over which leg odometry corrects the IMU's drift.
    imu_tau_ms: 300.0
    # rad/s, the joint speed norm below which a sample counts as static (bias update).
    static_dq: 0.3
    # Complementary filter only: the foot leg odometry uses, min-speed or mean.
    contact: min-speed
    # rw-ekf (random-walk velocity EKF) or complementary.
    filter: rw-ekf
    # m/s^2, the plausible body acceleration: the EKF's bandwidth and how fast its gate
    # re-accepts.
    ekf_amax: 3.0
    # m/s, the base leg-odometry measurement noise (1 sigma).
    ekf_r0: 0.02
    # The load scaling of that noise: sigma = r0 + r1 / max(leg load in Nm, lfloor).
    ekf_r1: 0.3
    # N m, the leg-load floor in that scaling.
    ekf_lfloor: 5.0
    # The Mahalanobis gate (3-dof chi^2; 11.34 is 99 %).
    ekf_chi2: 11.34
    # Consecutive rejected updates before one is forced in.
    ekf_rejcap: 50
    # true: also read truth_topic and print the estimate's error against it.
    compare: false
    truth_topic: rt/sportmodestate
    # true: run the offline math check and exit.
    selftest: false

# debug_visualizer_node: renders the measured robot with a ghost at the planner's best
# trajectory and writes an mp4 on shutdown (debug only; commands nothing).
mjpc_debug_visualizer:
  ros__parameters:
    # The fork's visualizer script (path); default under $MJPC_ROOT.
    visualizer_script: ""
    # The controller's task model (path); the ghost needs its qpos layout.
    scene: ""
    domain_id: 0
    iface: ""
    no_auto_iface: false
    lowstate_topic: rt/lowstate
    # The plan the controller core publishes when started by controller_launcher.py.
    plan_topic: rt/mjpc/plan
    # The estimator's output, never the sim's ground truth.
    sportstate_topic: rt/sportmodestate_est
    # The mp4 written on shutdown (path).
    out_path: /tmp/mjpc_plan.mp4
    # Hz, render and write rate.
    fps: 30.0
    # px
    width: 960
    height: 720
    # The MuJoCo camera to render from; "" tracks the pelvis.
    camera: ""
    # The ghost's colour, "r,g,b,a" in 0-1.
    ghost_rgba: "0.25,0.45,1.0,0.35"
    # sweep (the ghost walks the plan's horizon, fading) or single (one step).
    ghost_mode: sweep
    # Plan seconds per wall second of the sweep.
    sweep_rate: 1.0
    # The ghost's alpha at the far end of the sweep.
    ghost_alpha_far: 0.15
    # Single mode: the plan step to show; -1 the last.
    ghost_step: -1
    # > 0: also draw a fading trail at every n-th step.
    ghost_trail: 0
    # s, a plan older than this shows no ghost.
    plan_stale_sec: 1.0
    # true: put the ghost's base on the measured base, to compare posture alone.
    align_ghost_base: false
    # s of recording before it stops; 0 runs until shutdown.
    max_seconds: 0.0

# controller_launcher: runs an MJPC controller core as a child process and can release
# the sim's elastic band.
mjpc_deploy_lowerbody_controller:
  ros__parameters:
    # The installed core: mjpc_lowerbody_core (legs, Stabilize task) or
    # mjpc_fullbody_core (whole body, Lean task).
    controller_exe: mjpc_lowerbody_core
    # An absolute path that overrides controller_exe; default deploy_mjpc's lib/.
    controller_binary: ""
    # The MJPC task id.
    task: "Stabilize H12 Magpie"
    # The task's Strategy parameter; 6 stands (Stabilize's only slot).
    strategy: 6
    # Joint gravity feed-forward scale (tau = scale * qfrc_bias); 0 disables.
    gravity_ff: 0.85
    # s, the plant's /lowstate tick period: the planner's clock is ticks * twin_dt.
    twin_dt: 0.005
    # The SportModeState_ input topic (the IMU site's world pose).
    sportstate_topic: rt/sportmodestate_est
    # deg, the IMU's pitch and roll zero offsets.
    imu_pitch_offset_deg: 0.0
    imu_roll_offset_deg: 0.0
    # deg, each ankle's roll zero offset (encoder minus true).
    ankle_roll_offset_l_deg: 0.0
    ankle_roll_offset_r_deg: 0.0
    # DDS domain; default $ROS_DOMAIN_ID, else 0.
    domain_id: 0
    # Unused: deploy_mjpc builds the cores without the gRPC monitor server.
    grpc_port: 0
    # Rollouts per plan; 0 keeps the task's.
    plan_trajectories: 0
    # The planner's thread pool; 0 takes every hardware thread but 6 (at least 4).
    plan_threads: 0
    # s, either state stream older than this puts the core in its damping safe-hold.
    stale_sec: 0.05
    # The plant's real-time factor for latency compensation; 1.0 on the real robot.
    latency_rtf: 1.0
    # true: hold the measured pose until ENTER on the core's stdin, then hand over to
    # the planner (pairs with strategy 25; needs a terminal).
    straighten_start: false
    # -1 the task's deploy_frc_parity, 0 off, 1 caps the planner's forces at 0.9x the
    # safety layer's torque estop.
    frc_parity: -1
    # true: print a per-term cost breakdown to stderr once a second.
    cost: false
    # NIC to pin; "" auto-pins the robot subnet's.
    network_interface: ""
    # false for a core without --arm_aware (the full-body core).
    has_arm_aware: true
    # true: the legs pre-compensate measured arm and torso motion.
    arm_aware: true
    # true: call /elastic_band/toggle band_drop_after_secs after start (sim only).
    drop_band: true
    # s on the node's clock (sim seconds with use_sim_time) before that call.
    band_drop_after_secs: 20.0
