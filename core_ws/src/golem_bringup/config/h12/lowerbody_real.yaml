# lowerbody_controller_node's parameters on the real H1-2; every key is described in
# example.lowerbody.yaml. h12_lowerbody.launch.py sets active_policy from lowerbody:=.
lowerbody_controller_node:
  ros__parameters:
    # The real robot has no band; the operator lowers the gantry.
    disable_elastic_band: false
    # Negative pitch is an anti-lean bias: the policy believes it pitches further
    # forward and fights harder. The hanging-plumb static calibration would be +0.264.
    imu_offset_roll_deg: 0.50
    imu_offset_pitch_deg: -2.5
    imu_offset_yaw_deg: 0.0
    # The gap is measured between callbacks on the node's one executor, which also
    # runs the policy tick, so it includes executor stalls (a torch step, GC, CPU
    # contention): 0.25 s catches a dead /lowstate stream without silencing the legs
    # on a stall. Unmeasured on the real H1-2 (golem_lowerbody_rl's README).
    max_state_gap: 0.25
    cmd_vel_timeout: 0.5
