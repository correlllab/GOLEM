# lowerbody_controller_node's parameters in the simulators; every key is described in
# example.lowerbody.yaml. h12_lowerbody.launch.py sets active_policy from lowerbody:=
# (on the Mac, h12_sim_mac.launch.py passes GOLEM_LOWERBODY as it).
lowerbody_controller_node:
  ros__parameters:
    # Unattended sim runs engage once the pre-pose settles.
    engage_wait_for_confirm: false
    # The sim IMU has no mounting bias; the live trims still work for experiments.
    imu_offset_roll_deg: 0.0
    imu_offset_pitch_deg: 0.0
    imu_offset_yaw_deg: 0.0
    # frame_task_server's start-up moves end about 24 s after this node starts in
    # tests/stack and about 29 s under the full sim bringup; a band released before
    # then drops the robot.
    band_max_wait: 34.0
    # The sim can run slower than real time.
    max_state_gap: 0.5
    cmd_vel_timeout: 0.5
