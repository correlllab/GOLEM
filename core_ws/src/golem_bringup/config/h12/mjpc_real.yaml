# deploy_mjpc's parameters on the real H1-2 (the fork's validated B1 setup: the RW-EKF
# estimator in the loop); every key is described in example.mjpc.yaml.
# h12_lowerbody.launch.py's estimator_params defaults to this file; no launch file
# starts the controller. mujoco_mpc's mjpc/deploy/deploy_common.h holds the settings
# compiled into the core.

deploy_mjpc_estimator:
  ros__parameters:
    # SAFETY: debug mode has no sport service, so the estimator is the one writer of
    # rt/sportmodestate. Never run a second estimator.
    out_topic: rt/sportmodestate
    rate: 200.0
    filter: rw-ekf
    # Empty: the estimator picks the NIC on 192.168.123.x, as the core does. A NIC name
    # is host-specific (eno1 on the robot PC, a USB adapter on a laptop); set one only
    # to choose between two robot-subnet NICs.
    iface: ""

mjpc_deploy_lowerbody_controller:
  ros__parameters:
    task: "Stabilize H12 Magpie"
    strategy: 6                 # stand
    gravity_ff: 0.85            # validated on the real robot
    twin_dt: 0.001              # the real /lowstate ticks at 1 kHz
    sportstate_topic: rt/sportmodestate
    # Measured on this H1-2: the IMU reads -1.6 deg with the body vertical.
    imu_pitch_offset_deg: 1.6
    arm_aware: true
    drop_band: false            # the real robot has no elastic band
    # Sized for 12 P-cores. Nothing in this repo pins the controller or the
    # estimator to CPUs, and 0 takes every hardware thread but 6 (22 on the
    # 28-thread desktop). Drop to about 10 if the estimator starves under load.
    plan_threads: 12
