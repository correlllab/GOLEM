# deploy_mjpc's parameters in the H1-2 RoboCasa sim; every key is described in
# example.mjpc.yaml. No golem_bringup launch file loads this file: pass it to the
# deploy_mjpc nodes by hand (h12_lowerbody's estimator_params defaults to
# mjpc_real.yaml). The settings compiled into the core (200 Hz control, twin-time
# clocking, latency compensation, ramp, hold and blend timings, the torque-budget clamp,
# the watchdog) are in mujoco_mpc's mjpc/deploy/deploy_common.h.

deploy_mjpc_estimator:
  ros__parameters:
    # A side topic: nothing else publishes sport mode state in the sim, but the side
    # topic keeps the one-writer rule trivially safe. The controller reads it.
    out_topic: rt/sportmodestate_est
    rate: 200.0
    filter: rw-ekf
    # The filter runs on plant time: on the wall clock it over-integrates by 1/RTF in
    # this far-below-real-time sim, so its xy drifts about 4x the robot's motion and
    # the planner diverges laterally within seconds. Must equal the plant's
    # model.opt.timestep (see twin_dt). The real robot runs at 1x and leaves it 0.
    tick_dt: 0.005

mjpc_debug_visualizer:
  ros__parameters:
    # Must be a host-mounted path: docker_run.sh runs the ros container with
    # `compose run --rm`, so its /tmp is gone the moment `ros2 launch` exits, which is
    # when the mp4 is finalised. core_ws is bind-mounted, and core_ws/.gitignore's
    # log/ matches at any depth, so the file stays on the host and out of git.
    out_path: /home/code/core_ws/src/deploy_mjpc/log/mjpc_plan.mp4
    # osmesa renders this scene in about 96 ms a frame (shadows off, measured), and
    # the mp4's fps is fixed when the file opens, so a rate the loop cannot reach
    # makes a video that plays fast. The node reports the achieved rate on exit.
    fps: 10.0
    width: 960
    height: 720
    max_seconds: 0.0
    # The ghost's base is the planner's belief and the measured base the
    # estimator's; their gap shows the planner solving for a robot that is not where
    # it thinks. True compares posture alone.
    align_ghost_base: false
    # Plan row 0 is the measured state the core set (trajectory.cc seeds it), so a
    # single ghost at step 0 sits on the robot and shows nothing; the sweep walks the
    # whole horizon.
    ghost_mode: sweep
    sweep_rate: 1.0
    ghost_alpha_far: 0.15
    # On a stable stand the plan moves the base only about 1.8 cm and the joints about
    # 0.029 rad over its 1 s horizon (measured), so a ghost close to the robot is
    # right; judge it in the first few hundred ms of a fall, where the plan's intended
    # recovery and the robot part (deploy_common.h).
    plan_stale_sec: 1.0

mjpc_deploy_lowerbody_controller:
  ros__parameters:
    task: "Stabilize H12 Magpie"
    strategy: 6                 # stand, the stabilize task's only slot
    # Threads and the sim's real-time factor (RTF) are chosen together: the CEM
    # planner free-runs on wall time (about 55 iterations/s at 12 threads), so at a
    # slow RTF it runs about 4x more iterations per plant second than on the real
    # robot, its sampler collapses to its 0.01 rad floor and the stand settles into a
    # 5-7 plant-s wobble. Fewer threads fix only that half and need a slow sim, which
    # leaves the latency compensator (wall-clock dt predicted as sim seconds) leading
    # by 1/RTF. So run as the real robot does: 12 threads with RTF as near 1.0 as the
    # host allows (headless, GOLEM_CAMERAS=0: about 0.85, about 65 iterations per sim
    # second and 1.18x latency lead). Do not slow the sim down. If 12 threads
    # oversubscribe the host and RTF drops (check /clock's rate), use about 10.
    plan_threads: 12
    # Full gravity feed-forward: 1.0 holds the height (z about 0.92 over 40 s) where
    # 0.85 sinks to 0.64, because this plant compensates only the hands' gravity, not
    # the legs'. The 5-12 deg tilt wobble left comes from the contact and integrator
    # mismatch (RoboCasa's impratio 20, Euler, elliptic cones against the planner's
    # 100, implicitfast, pyramidal; the task XML warns Euler diverges on biped
    # balance). The real robot keeps 0.85.
    gravity_ff: 1.0
    # Must equal RoboCasa's model.opt.timestep: the sim publishes rt/lowstate at
    # that interval and the planner's clock is ticks * twin_dt. The stand is
    # dt-sensitive (it hangs at 0.002 and stands at 0.005, even at RTF 0.5). The H1-2
    # sim takes no flag for its timestep: check model.opt.timestep before using this.
    twin_dt: 0.005
    # The RW-EKF estimate, the real robot's signal path. Its filtered velocity gives
    # a quieter stand (3-5 deg tilt) than ground truth, whose full-bandwidth base
    # velocity the planner over-reacts to; the sim publishes no rt/sportmodestate.
    sportstate_topic: rt/sportmodestate_est
    imu_pitch_offset_deg: 0.0   # the sim IMU has no mounting offset
    arm_aware: true
    # With every sensor on, each 10 Hz lidar and camera cycle holds the sim lock for
    # up to about 1 s of wall time on a laptop, and sim time stops with it. The
    # threshold must sit above that freeze, or each cycle injects a damping blip;
    # 1.5 s rides it out and still catches a dead publisher. The real robot keeps the
    # compiled 0.05.
    stale_sec: 1.5
    # The band stays on until /elastic_band/toggle (or SPACE in the viewer). With
    # false the launcher leaves it alone: release it by hand once the robot supports
    # itself. True toggles it band_drop_after_secs (sim s) after start whatever the
    # posture, and the service is a toggle, so a second call puts the band back on.
    drop_band: false
    band_drop_after_secs: 25.0
