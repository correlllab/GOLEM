# The G1's leg data; every key is described in ../example.robot.yaml.
legs:
  - left_hip_pitch_joint
  - left_hip_roll_joint
  - left_hip_yaw_joint
  - left_knee_joint
  - left_ankle_pitch_joint
  - left_ankle_roll_joint
  - right_hip_pitch_joint
  - right_hip_roll_joint
  - right_hip_yaw_joint
  - right_knee_joint
  - right_ankle_pitch_joint
  - right_ankle_roll_joint
# HOMIE was trained on the pelvis IMU and reads /lowstate's IMU as it
imu_frame: pelvis
policies: [homie]
default_policy: homie
