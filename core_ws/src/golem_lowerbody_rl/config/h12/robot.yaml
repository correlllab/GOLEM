# The H1-2's leg data; every key is described in ../example.robot.yaml.
legs:
  - left_hip_yaw_joint
  - left_hip_pitch_joint
  - left_hip_roll_joint
  - left_knee_joint
  - left_ankle_pitch_joint
  - left_ankle_roll_joint
  - right_hip_yaw_joint
  - right_hip_pitch_joint
  - right_hip_roll_joint
  - right_knee_joint
  - right_ankle_pitch_joint
  - right_ankle_roll_joint
policies: [almi, walk, fame]
# every H1-2 bringup runs ALMI: it stands and walks in one policy
default_policy: almi
