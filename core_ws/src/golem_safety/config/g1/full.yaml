# A real-G1 config with one full-body input; no bringup runs it, and golem_upper_ik's
# pairing refuses it. Keys, units and allowed values:
# config/example.yaml.
# SAFETY: the layer writes every motor from boot, so the robot must already be in Unitree's
# debug mode, on a gantry, when it starts.
mode: full_body_mode

topics:
  low_cmd_in: /safety/lowcmd_in
  low_cmd_out: /lowcmd
  low_state: /lowstate

control:
  publish_hz: 500.0
  # Off: the G1's /lowstate tick is unmeasured on the real G1.
  state_lag_ms: 0.0

stale:
  # 10 periods of a 50 Hz controller.
  lower_seconds: 0.2
  # 50 periods of the robot's 500 Hz /lowstate.
  state_seconds: 0.1

# SAFETY: zero turns every motor off and keep_writing keeps it so, so the robot drops:
# support it (a gantry). The robot runs in Unitree's debug mode, where nothing else holds it.
estop_response:
  mode: zero
  # For damp only; unmeasured on the real G1.
  kd: 8.0
  after: keep_writing

limits:
  # Unmeasured on the real G1: placeholders until tuned with the walking policy.
  clip:
    position_offset: 0.01
    velocity_ratio: 0.10
    torque_ratio: 0.60
    kp_max: 200.0
    kd_max: 10.0
  estop:
    position_offset: 0.0
    velocity_ratio: 0.50
    torque_ratio: 0.90

logging:
  enabled: true
  base_dir: /tmp/golem_safety
  chunk_prefix: chunk_
