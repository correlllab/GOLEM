# Simulated G1 (RoboCasa), default: golem_upper_ik drives waist + arms over
# /arm_sdk while Unitree's controller keeps the legs balanced.
#
# Nothing is published until an upper-body command passes the engage gate
# (below); the weight slot (motor 29) then ramps 0 -> 1 over engage_seconds. On
# estop, and when the node exits, the last good command is held while the
# weight ramps back to 0 over release_seconds, handing waist + arms back to
# Unitree. The estop stays latched until restart.
# Estop limits are relaxed so sim contact spikes do not latch it.
mode: arm_sdk_mode

topics:
  low_cmd_upper_in: /safety/lowcmd_upper_in
  low_cmd_out: /arm_sdk
  low_state: /lowstate

control:
  publish_hz: 500.0
  # Estop when /lowstate arrives this many ms later than the robot's own tick
  # clock implies; a value <= 0 disables the check. It is off because the G1's
  # /lowstate tick has not been measured on the real robot.
  state_lag_ms: 0.0

# Seconds. An input, or /lowstate, with no new sample for longer than this is
# reported while its last command keeps being relayed; a value <= 0 disables
# the report.
stale:
  # waist + arm input
  upper_seconds: 2.0
  # longest gap on /lowstate; relaxed because the sim can run slower than real
  # time, while the timers measure real time
  state_seconds: 1.0

# The engage gate: start only when /lowstate is fresh (relaxed like the stale
# times: the sim can run slower than real time), reports the profile's
# mode_machine (5, as the sim's G1 does), and the command is within
# max_position_error of the measured q.
startup:
  rule: engage_gate

engage:
  max_state_age_seconds: 1.0
  # rad
  max_position_error: 0.15

arm_sdk:
  engage_seconds: 1.0
  release_seconds: 1.0
  # a command with a waist (slots 12-14) kp below this latches the estop
  waist_kp_min: 40.0

# arm_sdk_mode hands the waist and arms back by ramping the weight to 0 (see
# arm_sdk), so mode and kd are not used.
estop_response:
  mode: zero
  after: keep_writing

limits:
  # position_offset and the ratios are scalars or 29-entry lists (slot order) for
  # per-joint tuning; kp_max and kd_max are single numbers. Ratios scale the URDF
  # limits in g1_description
  # starting values, not yet tuned on our G1
  clip:
    position_offset: 0.01
    velocity_ratio: 0.10
    torque_ratio: 0.60
    kp_max: 200.0
    kd_max: 10.0
  # checked on waist + arms (slots 12-28) only, and only once engaged
  estop:
    position_offset: -0.01
    velocity_ratio: 2.0
    torque_ratio: 2.0

logging:
  enabled: true
  base_dir: /tmp/g1_safety_layer
  chunk_prefix: chunk_
