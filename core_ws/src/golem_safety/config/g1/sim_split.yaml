# Simulated G1 (RoboCasa), full body on /lowcmd: legs (slots 0-11) from a lower-body
# controller, waist + arms (12-28) from the upper-body controller, merged here.
# Unitree's controller must be released first (motion_switcher); on estop every
# motor is zeroed or damped (see estop_response).
# Nothing is published until both inputs have sent a command and the merged
# command passes the engage gate (below), and /lowstate is checked only from
# then on. Each input's quiet time starts at its own first command: an input
# quiet for its stale time, or, once engaged, /lowstate for stale.state_seconds,
# is reported while its last command keeps being relayed.
# Estop limits are relaxed so sim contact spikes do not latch it.
mode: split_mode

topics:
  low_cmd_lower_in: /safety/lowcmd_lower_in
  low_cmd_upper_in: /safety/lowcmd_upper_in
  low_cmd_out: /lowcmd
  low_state: /lowstate

control:
  publish_hz: 500.0
  # Estop when /lowstate arrives this many ms later than the robot's own tick
  # clock implies. Only enforced on ROS domain 0 (the real robot): the sims
  # stamp tick in sim steps, not wall-clock ms. A value <= 0 disables it.
  state_lag_ms: 100.0

# Seconds. An input, or /lowstate, with no new sample for longer than this is
# reported while its last command keeps being relayed; a value <= 0 disables
# the report.
stale:
  # waist + arm input
  upper_seconds: 2.0
  # longer than split.yaml's 0.2 s because the sim can run slower than real
  # time, while the timers measure real (wall-clock) time, not sim time
  lower_seconds: 1.0
  # longest gap on /lowstate, relaxed the same way
  state_seconds: 1.0

# The engage gate: start only when /lowstate is fresh (relaxed like the stale
# times: the sim can run slower than real time), reports the profile's
# mode_machine (5, as the sim's G1 does), and the command is within
# max_position_error of the measured q.
startup:
  rule: engage_gate

engage:
  max_state_age_seconds: 1.0
  # rad
  max_position_error: 0.15

# The estop command on /lowcmd. zero: every motor off, so the robot drops and
# must be supported (e.g. on a gantry). damp: every motor stays enabled with
# kp = 0, q = dq = tau = 0 and the kd below, so it sinks instead of dropping.
# keep_writing: the estop command keeps being written.
estop_response:
  mode: zero
  # used by damp only: scalar or 29-entry list, at most limits.clip.kd_max;
  # a starting value, not yet tuned on our G1
  kd: 8.0
  after: keep_writing

limits:
  # position_offset and the ratios are scalars or 29-entry lists (slot order) for
  # per-joint tuning; kp_max and kd_max are single numbers. Ratios scale the URDF
  # limits in g1_description
  # untuned placeholders: set these with the lower-body controller
  clip:
    position_offset: 0.01
    velocity_ratio: 0.10
    torque_ratio: 0.60
    kp_max: 200.0
    kd_max: 10.0
  estop:
    position_offset: -0.01
    velocity_ratio: 2.0
    torque_ratio: 2.0

logging:
  enabled: true
  base_dir: /tmp/g1_safety_layer
  chunk_prefix: chunk_
