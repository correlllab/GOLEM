# The G1 sim's config (g1_sim.launch.py): split.yaml with longer stale times and relaxed
# estop limits. Keys, units and allowed values:
# config/example.yaml.
mode: split_mode

topics:
  low_cmd_lower_in: /safety/lowcmd_lower_in
  low_cmd_upper_in: /safety/lowcmd_upper_in
  low_cmd_out: /lowcmd
  low_state: /lowstate

control:
  publish_hz: 500.0
  # Off, as in split.yaml; the check runs only on ROS domain 0 in any case.
  state_lag_ms: 0.0

stale:
  upper_seconds: 2.0
  # The sim can run slower than real time, and these are measured on the host's clock,
  # not in sim time.
  lower_seconds: 1.0
  state_seconds: 1.0

# As split.yaml, so that the sim's estop drops the robot as the real G1's does.
estop_response:
  mode: zero
  # For damp only.
  kd: 8.0
  after: keep_writing

limits:
  # As split.yaml.
  clip:
    position_offset: 0.01
    velocity_ratio: 0.10
    torque_ratio: 0.60
    kp_max: 200.0
    kd_max: 10.0
  # Relaxed so that contact spikes in the sim do not latch.
  estop:
    position_offset: -0.1
    velocity_ratio: 2.0
    torque_ratio: 2.0

logging:
  enabled: true
  base_dir: /tmp/golem_safety
  chunk_prefix: chunk_
