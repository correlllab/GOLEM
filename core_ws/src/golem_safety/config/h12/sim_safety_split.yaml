mode: split_mode

topics:
  low_cmd_lower_in: /safety/lowcmd_lower_in
  low_cmd_upper_in: /safety/lowcmd_upper_in
  low_cmd_out: /lowcmd
  low_state: /lowstate

control:
  publish_hz: 500.0
  # Estop when /lowstate arrives this many ms later than the robot's own tick
  # clock implies. Only enforced on ROS domain 0 (the real robot): the sims
  # stamp tick in sim steps, not wall-clock ms. A value <= 0 disables it.
  state_lag_ms: 100.0

# Seconds. An input, or /lowstate, with no new sample for longer than this is
# reported while its last command keeps being relayed; a value <= 0 disables
# the report.
# upper_seconds applies in split_mode only.
stale:
  upper_seconds: 0.0
  lower_seconds: 0.2
  state_seconds: 0.1

# On estop the layer streams burst_count zero-gain commands and then stops
# publishing.
estop_response:
  mode: zero
  after: burst_then_silence
  burst_count: 50

limits:
  # position_offset, velocity_ratio and torque_ratio are scalars or 27-entry lists
  # in slot order for per-joint tuning; kp_max and kd_max are single numbers
  clip:
    position_offset: 0.001
    velocity_ratio: 3.0
    torque_ratio: 3.0
    kp_max: 500.0
    kd_max: 30.0
  estop:
    position_offset: -0.1
    velocity_ratio: 3.0
    torque_ratio: 3.0

logging:
  enabled: false
  base_dir: /tmp/golem_safety
  chunk_prefix: chunk_
