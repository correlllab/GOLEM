# Keys, units and allowed values: config/example.yaml.
mode: split_mode

topics:
  low_cmd_lower_in: /safety/lowcmd_lower_in
  low_cmd_upper_in: /safety/lowcmd_upper_in
  low_cmd_out: /lowcmd
  low_state: /lowstate

control:
  publish_hz: 500.0
  state_lag_ms: 100.0

stale:
  upper_seconds: 0.0
  lower_seconds: 0.2
  state_seconds: 0.1

estop_response:
  mode: zero
  after: burst_then_silence
  burst_count: 50

limits:
  clip:
    position_offset: 0.001
    velocity_ratio: 3.0
    torque_ratio: 3.0
    kp_max: 500.0
    kd_max: 30.0
  estop:
    position_offset: -0.1
    velocity_ratio: 3.0
    torque_ratio: 3.0

logging:
  enabled: false
  base_dir: /tmp/golem_safety
  chunk_prefix: chunk_
