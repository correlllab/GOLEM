# FAST-LIO on the G1 sim's MID-360: /livox/lidar (livox_ros_driver2/CustomMsg,
# 10 Hz) and /livox/imu (sensor_msgs/Imu, 200 Hz), both in livox_frame, the
# sensor's own frame, which is upside down on the G1. Every key is described in
# ../example.fastlio.yaml.
/**:
    ros__parameters:
        feature_extract_enable: false
        point_filter_num: 1          # keep every point: a synthetic scan is sparser than the real one
        max_iteration: 3
        # 0.1 m kept FAST-LIO within about 1 cm on a synthetic scan, 0.2 m 5 cm off.
        filter_size_surf: 0.1
        filter_size_map: 0.1
        cube_side_length: 1000.0
        runtime_pos_log_enable: false
        map_file_path: ""

        common:
            lid_topic: "/livox/lidar"
            imu_topic: "/livox/imu"
            time_sync_en: false
            time_offset_lidar_to_imu: 0.0

        preprocess:
            lidar_type: 1            # the sim publishes Livox CustomMsg
            scan_line: 6             # keeps every line: the sim numbers them 0-3
            blind: 0.7               # m from the lidar; the arm and hand meshes in 'home' are 0.38-0.57 m away
            timestamp_unit: 3        # unused for CustomMsg (offset_time is in ns)
            scan_rate: 10

        mapping:
            acc_cov: 0.1
            gyr_cov: 0.1
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            fov_degree: 360.0
            det_range: 100.0
            # FAST-LIO's upstream MID-360 value, which the sim's IMU offset matches; R
            # is identity in the raw sensor frame. Not estimated online, because
            # body_to_pelvis reads these values for its dynamic body -> pelvis.
            extrinsic_est_en: false
            extrinsic_T: [-0.011, -0.02329, 0.04412]
            extrinsic_R: [1., 0., 0.,
                          0., 1., 0.,
                          0., 0., 1.]

        publish:
            path_en: true
            effect_map_en: false
            map_en: false            # /Laser_map, the whole map every second; on only to inspect
            scan_publish_en: true
            dense_publish_en: false
            scan_bodyframe_pub_en: true

        pcd_save:
            pcd_save_en: false
            interval: -1
