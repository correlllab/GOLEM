# The G1's values for golem_slam's navigation graph; every key is described in
# ../example.pipeline.yaml. Its MID-360 is lower than the H1-2's.
lidar_link: mid360_link
scan:                    # above floor returns and FAST-LIO's z drift, below the G1's top
  min_height: 0.15
  max_height: 1.3
level_odom:
  min_floor_depth: 0.5
footprint:               # the local costmap's footprint (golem_slam/dynamic_footprint.py)
  arm_links: [left_elbow_link, left_wrist_roll_link, left_wrist_pitch_link,
              left_wrist_yaw_link, left_hand_palm_link,
              right_elbow_link, right_wrist_roll_link, right_wrist_pitch_link,
              right_wrist_yaw_link, right_hand_palm_link]
  padding: 0.05
