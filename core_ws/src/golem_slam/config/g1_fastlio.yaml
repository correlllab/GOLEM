# FAST_LIO on the real G1's MID-360, from golem_bringup's g1_real_drivers.launch.py
# (livox_ros_driver2 in the laptop's golem_ros container, on
# g1_MID360_config.json). Not yet run on our G1.
#
# FAST_LIO names its frames camera_init (the IMU's start pose) and body (the
# IMU). level_odom aligns odom -> camera_init from the IMU and floor scan, and
# g1_body_to_pelvis publishes body -> pelvis from the URDF waist TF and
# mapping.extrinsic_T/R below. Edit the extrinsic here, not there.
/**:
    ros__parameters:
        feature_extract_enable: false
        point_filter_num: 3          # FAST_LIO's upstream MID-360 value (~20k points per 10 Hz scan)
        max_iteration: 3
        filter_size_surf: 0.5        # upstream values, not tuned on the G1
        filter_size_map: 0.5
        cube_side_length: 1000.0
        runtime_pos_log_enable: false
        map_file_path: ""

        common:
            # the driver's, with multi_topic 0 and xfer_format 1 (CustomMsg)
            lid_topic: "/livox/lidar"
            imu_topic: "/livox/imu"
            # the stamps must be on the laptop's clock: unsynced, the driver
            # stamps each packet with the host's clock on arrival; with PTP or
            # GPS sync it passes the lidar's time through
            time_sync_en: false
            time_offset_lidar_to_imu: 0.0

        preprocess:
            lidar_type: 1            # Livox CustomMsg (FAST_LIO's AVIA path)
            scan_line: 4             # the MID-360's 4 lines
            blind: 0.7               # m from the lidar; the arm and hand meshes in 'home' are 0.38-0.57 m away
            timestamp_unit: 3        # unused for CustomMsg (offset_time is in ns)
            scan_rate: 10            # the driver's publish_freq

        mapping:
            acc_cov: 0.1
            gyr_cov: 0.1
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            fov_degree: 360.0
            det_range: 100.0
            # The MID-360's lidar origin in its own IMU's frame (p_imu = R p_lidar + T):
            # FAST_LIO's upstream MID-360 value. Not estimated online: the launch
            # file's transforms use these values.
            extrinsic_est_en: false
            extrinsic_T: [-0.011, -0.02329, 0.04412]
            # R is identity for the raw sensor frame: g1_MID360_config.json's
            # extrinsic_parameter is all zero (the URDF's mid360_joint holds the
            # upside-down mounting). A nonzero one would rotate the points but not
            # the IMU.
            extrinsic_R: [1., 0., 0.,
                          0., 1., 0.,
                          0., 0., 1.]

        publish:
            path_en: true
            effect_map_en: false
            map_en: false            # /Laser_map, the whole map every second; on only to inspect
            scan_publish_en: true
            dense_publish_en: false
            scan_bodyframe_pub_en: true

        pcd_save:
            pcd_save_en: false
            interval: -1
