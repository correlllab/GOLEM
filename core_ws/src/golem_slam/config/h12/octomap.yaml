# octomap_server on the H1-2; every key is described in ../example.octomap.yaml.
octomap_server:
  ros__parameters:
    frame_id: map
    base_frame_id: pelvis
    # 0.10 m voxels and a 6 m ray range keep octomap_server at the 10 Hz scan
    # rate on the onboard PC (~30% of one core). 0.05 m, or ranges of 8 m,
    # saturate a core and the map falls behind the scan by most of a second.
    resolution: 0.10
    sensor_model.max_range: 6.0
    sensor_model.hit: 0.7
    sensor_model.miss: 0.4
    sensor_model.min: 0.12
    # From 0.9, about 6 scans whose rays pass through a voxel free it (0.97 takes
    # about 9), so moved objects and noise clear fast.
    sensor_model.max: 0.9
    # The floor is inserted too, so rays through free space clear stale voxels.
    point_cloud_min_z: -0.5
    point_cloud_max_z: 2.5
    # The lower bound sits above floor returns plus FAST-LIO's z drift; the upper
    # bound clears the H1-2's height (~1.8 m) so overhangs it can walk under stay free.
    occupancy_min_z: 0.15
    occupancy_max_z: 1.9
    filter_speckles: true
    filter_ground_plane: false
    use_height_map: true
    color_factor: 0.8
    publish_free_space: false
    latch: true
