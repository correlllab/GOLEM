# The H1-2's values for golem_slam's navigation graph (navigation_launch.py).
# The MID-360 hangs upside down under the head, on the torso.
lidar_link: livox_link   # the URDF's link for the raw sensor frame, livox_frame
scan:                    # m above the floor: /converted_scan's band
  min_height: 0.25
  max_height: 1.7
level_odom:
  min_floor_depth: 1.0   # m below the lidar, which is >= ~1.4 m above the floor
