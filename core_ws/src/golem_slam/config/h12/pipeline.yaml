# The H1-2's values for golem_slam's navigation graph; every key is described in
# ../example.pipeline.yaml.
lidar_link: livox_link
scan:                    # above floor returns and FAST-LIO's z drift, below the H1-2's top
  min_height: 0.25
  max_height: 1.7
level_odom:
  min_floor_depth: 1.0   # the lidar is at least ~1.4 m above the floor in every stance
