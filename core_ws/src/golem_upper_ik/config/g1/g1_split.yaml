# The real G1's controller config, run with golem_safety's split (pairing.yaml), HOMIE's
# walking policy on the legs. Every key: example.controller.yaml.

topics:
  low_cmd: /safety/lowcmd_upper_in
  low_state: /lowstate

controller:
  # kept low for the first sessions: unmeasured on the real G1 (raise them once its logs
  # show the tracking)
  v_lim: 0.15
  w_lim: 0.5
  dq_lim: 0.3
  # the H1-2's: at home, the start-up posture, the closest pairs (the upper arms against the
  # torso) are 0.025 m apart (CL_Assets/README.md)
  d_min: 0.02
  timeout: 10.0  # 5 s is too short at these speeds
  hold_targets:
    waist_yaw_joint: 0.0
    waist_roll_joint: 0.0
    waist_pitch_joint: 0.0
  state_timeout: 5.0
  follow_tolerance: 0.05
  startup_timeout: 30.0
  startup_move_timeout: 30.0
  threshold_ik: 0.0001
  # the arm PD without an integral term (gains.ki 0) settles about 1e-3 rad off under
  # gravity, inside this
  threshold_joint: 0.01
  threshold_linear: 0.001
  threshold_angular: 0.002

planner:
  planner: RRTConnect
  timeout: 1.0
  frame_names:
    - left_hand_palm_link
    - right_hand_palm_link

frequency:
  ctrl_hz: 30
  pub_hz: 500
  check_hz: 1000

gains:
  # Waist (yaw, roll, pitch), then the left and right arms, in slot order. HOMIE walks
  # expecting a stiff waist (trained with waist kp 300), so the waist kp is golem_safety's
  # kp_max (200). The waist kd gives a damping ratio kd / (2 sqrt(kp I)) of 0.4 to 0.5 with
  # the URDF's waist inertia I at home (test_config.py checks it); roll and pitch are at
  # golem_safety's kd_max (10). The arms take the kp 60 and kd 1.5 of Unitree's G1 arm
  # example (unitree_sdk2_python's g1_arm7_sdk_dds_example.py). Starting values: unmeasured
  # on the real G1.
  kp: [200.0, 200.0, 200.0,
       60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0,
       60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0]
  kd: [8.0, 10.0, 10.0,
       1.5, 1.5, 1.5, 1.5, 1.5, 1.5, 1.5,
       1.5, 1.5, 1.5, 1.5, 1.5, 1.5, 1.5]
  ki: 0.0  # no integral term until the gains are tuned on the real G1

limits:
  clip:
    position_offset: 0.01
    velocity_ratio: 0.10
    torque_ratio: 0.60
