# The G1 sim's controller config (RoboCasa), run with golem_safety's sim_split
# (pairing.yaml), HOMIE's walking policy on the legs. Every key: example.controller.yaml.

topics:
  low_cmd: /safety/lowcmd_upper_in
  low_state: /lowstate

controller:
  v_lim: 0.5
  w_lim: 1.0
  # the H1-2's arm top speed (its safety_split), so the G1 sim's arms move no faster than the
  # H1-2's; the real G1's g1_split keeps 0.3
  dq_lim: 0.83
  # the H1-2's: at home, the start-up posture, the closest pairs (the upper arms against the
  # torso) are 0.025 m apart (CL_Assets/README.md)
  d_min: 0.02
  timeout: 5.0
  hold_targets:
    waist_yaw_joint: 0.0
    waist_roll_joint: 0.0
    waist_pitch_joint: 0.0
  state_timeout: 5.0
  follow_tolerance: 0.05
  startup_timeout: 30.0
  startup_move_timeout: 30.0
  threshold_ik: 0.0001
  # m, rad: in the RoboCasa sim the hold settles each grasp frame within 0.4 mm and 0.5 mrad
  # of its target with gains.ki (45 goals), 0.6 mm and 1 mrad without it (33 goals); a planned
  # goal holds the IK solve's solution, which stops within 1 mm and 10 mrad
  # (ik_solver.LINEAR_THRESHOLD, ANGULAR_THRESHOLD). The H1-2's measure the same
  threshold_linear: 0.002
  threshold_angular: 0.01

planner:
  planner: RRTConnect
  timeout: 1.0
  frame_names:
    - left_hand_palm_link
    - right_hand_palm_link

frequency:
  ctrl_hz: 30
  pub_hz: 500
  check_hz: 1000

gains:
  # as the real G1's (g1_split.yaml says why)
  kp: [200.0, 200.0, 200.0,
       60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0,
       60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0]
  kd: [8.0, 10.0, 10.0,
       1.5, 1.5, 1.5, 1.5, 1.5, 1.5, 1.5,
       1.5, 1.5, 1.5, 1.5, 1.5, 1.5, 1.5]
  # Waist 0: a grasp goal integrates its targeted arms only, so the waist holds by its PD.
  # Arms 150, kp / ki 0.4 s as the H1-2's shoulders and elbows: in the RoboCasa sim the hold
  # then settles each grasp frame within 0.4 mm and 0.5 mrad of its target (0.6 mm and 1 mrad
  # without it), with no oscillation over 45 goals
  ki: [0.0, 0.0, 0.0,
       150.0, 150.0, 150.0, 150.0, 150.0, 150.0, 150.0,
       150.0, 150.0, 150.0, 150.0, 150.0, 150.0, 150.0]

limits:
  clip:
    position_offset: 0.01
    velocity_ratio: 0.10
    torque_ratio: 0.60
