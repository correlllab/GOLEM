# The G1 sim's controller config (RoboCasa), run with golem_safety's sim_split
# (pairing.yaml), HOMIE's walking policy on the legs. Every key: example.controller.yaml.

topics:
  low_cmd: /safety/lowcmd_upper_in
  low_state: /lowstate

controller:
  v_lim: 0.5
  w_lim: 1.0
  dq_lim: 1.0
  # the H1-2's: at home, the start-up posture, the closest pairs (the upper arms against the
  # torso) are 0.025 m apart (CL_Assets/README.md)
  d_min: 0.02
  timeout: 5.0
  hold_targets:
    waist_yaw_joint: 0.0
    waist_roll_joint: 0.0
    waist_pitch_joint: 0.0
  state_timeout: 5.0
  follow_tolerance: 0.05
  startup_timeout: 30.0
  startup_move_timeout: 30.0
  imu_frame: imu_in_pelvis
  threshold_ik: 0.0001
  # the arm PD without an integral term (gains.ki 0) settles about 1e-3 rad off under
  # gravity, inside this
  threshold_joint: 0.01
  threshold_linear: 0.001
  threshold_angular: 0.002

planner:
  planner: RRTConnect
  timeout: 1.0
  frame_names:
    - left_hand_palm_link
    - right_hand_palm_link

frequency:
  ctrl_hz: 30
  pub_hz: 500
  check_hz: 1000

gains:
  # as the real G1's (g1_split.yaml says why)
  kp: [200.0, 200.0, 200.0,
       60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0,
       60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0]
  kd: [8.0, 10.0, 10.0,
       1.5, 1.5, 1.5, 1.5, 1.5, 1.5, 1.5,
       1.5, 1.5, 1.5, 1.5, 1.5, 1.5, 1.5]
  ki: 0.0

limits:
  clip:
    position_offset: 0.01
    velocity_ratio: 0.10
    torque_ratio: 0.60
