# The format of pairing.yaml, read by golem_upper_ik.pairing: one key, pairs, mapping each
# golem_safety config name (its config/<robot>/ file name without .yaml) to the one
# controller config name (a file of this directory) that may run with it. A config named
# sim* is a sim config: the pairing refuses it on the real robot; a robot that pairs one
# also refuses its real configs in the sim, and a robot with none runs them there. This file documents the format: setup.py does not install it, and test_pairing.py
# checks that it loads as a pairing.yaml would.
pairs:
  relax_safety_split: safety_split
  relax_safety_full: safety_full
