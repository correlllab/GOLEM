# The controller config each H1-2 safety config runs with (golem_upper_ik.pairing). The
# *_split safety configs relay the upper-body input safety_split writes, the *_full ones
# the full-body input safety_full writes, and sim_safety_split's limits suit the sim.
# Format: example.pairing.yaml.
pairs:
  relax_safety_split: safety_split
  default_safety_split: safety_split
  tight_safety_split: safety_split
  sim_safety_split: sim_safety_split
  relax_safety_full: safety_full
  default_safety_full: safety_full
  tight_safety_full: safety_full
  locomotion_safety_full: safety_full
