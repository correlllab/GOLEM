# The real H1-2's controller config on golem_safety's upper-body input, run with the
# *_safety_split safety configs (pairing.yaml). Every key: example.controller.yaml.

topics:
  low_cmd: /safety/lowcmd_upper_in
  low_state: /lowstate

controller:
  v_lim: 1.0
  w_lim: 2.0
  dq_lim: 1.0
  d_min: 0.02
  timeout: 5.0
  hold_targets:
    torso_joint: 0.0
  threshold_ik: 0.0001
  threshold_joint: 0.01
  threshold_linear: 0.001
  threshold_angular: 0.002

planner:
  planner: RRTConnect
  timeout: 1.0
  range: 0.0
  try_direct: true
  simplify: true
  simplify_time: 1.0
  shortcut: true
  moving_speed: 0.30
  min_interpolation_steps: 30
  max_interpolation_steps: 300
  validity_resolution: 0.0025
  constraint_check_steps: 10
  frame_names:
    - left_grasp_frame
    - right_grasp_frame
  frame_x_max: 0.60
  frame_y_min: -0.45
  frame_y_max: 0.45
  frame_z_min: -0.05
  # below the head camera (z 0.688 m) and the lidar (0.680 m), above the shoulder pitch
  # joints (0.423 m), all at the zero pose
  frame_z_max: 0.60
  frame_limit_margin: 0.01
  frame_z_corridor_margin: 0.05
  start_limit_tolerance: 0.05

frequency:
  ctrl_hz: 30
  pub_hz: 500

gains:
  # torso, then the left and right arms, in slot order
  kp: [160.0,
       240.0, 200.0, 150.0, 150.0, 120.0, 120.0, 120.0,
       240.0, 200.0, 150.0, 150.0, 120.0, 120.0, 120.0]
  kd: [10.0,
       12.0, 12.0, 12.0, 12.0, 12.0, 12.0, 12.0,
       12.0, 12.0, 12.0, 12.0, 12.0, 12.0, 12.0]
  ki: [60.0,
       600.0, 600.0, 400.0, 400.0, 100.0, 100.0, 100.0,
       600.0, 600.0, 400.0, 400.0, 100.0, 100.0, 100.0]

limits:
  clip:
    position_offset: 0.001
    velocity_ratio: 0.10
    # torso, then the arms in slot order. The elbows' 1.1111 x 18 N*m = 20.0 N*m is for
    # high-force grasping; the golem_safety config in use is the real ceiling
    torque_ratio: [0.60,
                   0.60, 0.60, 0.60, 1.1111, 0.60, 0.60, 0.60,
                   0.60, 0.60, 0.60, 1.1111, 0.60, 0.60, 0.60]
