mode: split_mode

topics:
  low_cmd_lower_in: rt/safety/lowcmd_lower_in
  low_cmd_upper_in: rt/safety/lowcmd_upper_in
  low_cmd_out: rt/lowcmd
  low_state: rt/lowstate

network:
  domain_id: 1
  interface: ''

control:
  publish_hz: 500.0

estop:
  enabled: false
  estop_topic: h12/estop_status_raw
  poll_hz: 500.0
  upper_stale_seconds: 0.0
  # Arms after the first lower sample; expiration latches all outputs disabled.
  lower_stale_seconds: 0.2

limits:
  clip:
    position_offset: 0.001
    velocity_ratio: 3.0
    torque_ratio: 3.0
    kp_max: 500.0
    kd_max: 30.0
  estop:
    position_offset: -0.1
    velocity_ratio: 3.0
    torque_ratio: 3.0

logging:
  enabled: false
  base_dir: /tmp/h12_safety_layer
  chunk_prefix: chunk_
