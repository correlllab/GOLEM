# Each robot's torso-IMU (/lowstate imu_state) orientation calibration, keyed by the robot's policy folder name
# (policies/<robot>/), and each robot's simulators' as <robot>_sim. marl_deploy_node reads the entry its `robot`
# parameter names (default the policy folder's name; lmg_sim passes h12_sim) and passes it to
# MarlController(imu_calibration=...), which applies
# it only to a policy whose export.yaml has imu.orientation: calibrated; a raw policy (imu.orientation raw, or an
# older export with imu.quat_bias_deg) reads the IMU as reported, and the node logs that the calibration is ignored.
# A calibrated policy on a robot whose entry is null is refused at start.
#
#   roll_deg, pitch_deg, yaw_deg: what the quaternion reads (deg) with imu_link level: reported = true * R_bias,
#     R_bias = Rz(yaw) Ry(pitch) Rx(roll); pitch positive nose down, roll positive tilting right (Isaac's
#     quat_from_euler_xyz, as training's lowstate_imu.py). The deploy applies corrected = reported * R_bias^-1.
#   rotate_gyro: false (training biased the quaternion only: an estimator offset); true re-expresses the gyro (and
#     the specific force) in the level frame, for an offset that is a physical mounting tilt.
#
# Measure with calibrate_imu (README "IMU calibration"): both feet flat on level ground, still. Write the date, the
# method and each bag's numbers beside the value. Yaw is unobservable that way: leave it 0.

# H1-2: pitch -2.2 (2026-11-23), the midpoint of the leg kinematics (-2.11) and the torso accelerometer (-2.33) on a
# flat-footed stand; roll stays +0.1 (provisional, below) until the right ankle pitch zero is checked.
# Measured on the 2026-11-23 bags of LegsFastEnv60k_s42 (fastenv60k_2026-11-23/):
#   standing2 (an 18.7 min stand, both feet flat), calibrate_imu: roll +0.83 pitch -2.11 (112986 still samples); left
#     foot pitch -0.68, right -3.54: the feet disagree by 2.87 pitch, 0.08 roll (the right sole ~3 deg more toe-down by
#     kinematics again, as on 11-20: a suspected right ankle pitch encoder zero offset)
#   the quaternion against the torso IMU's own accelerometer tilt, standing windows: pitch -2.34 / roll -0.18
#     (standing2), -2.34 / -0.17 (lmg_legsfastenv60k_s42_2026-11-23_1445), -2.31 / -0.16 (_1440; the robot leaned back
#     onto its heels in _1440 and _1445): constant across 35 min and 6 deg of real lean
#   standing2's accelerometer tilt against its leg kinematics: pitch agree within 0.23
# The two methods agree in pitch (-2.11 / -2.33) but not in roll (+0.83 / -0.17): the kinematic roll leans on the
# right ankle. Re-check the right ankle zero, then settle roll.
#
# Previously (2026-11-22) provisional roll +0.1, pitch -2.7, the middle of every estimate. Measured 2026-11-21 with
# calibrate_imu (forward kinematics soles -> imu_link against the quaternion, still windows with both knees loaded) on
# the two 2026-11-20 deploy bags, robot lowered onto its feet under the hoist in the pre-pose:
#   lmg_legsenergy200k_s43_2026-11-20_1157: roll +0.42 pitch -2.12 (4589 /lowstate samples, 9.2 s); left foot +1.04 / -0.42,
#     right foot -0.20 / -3.83: the feet disagree by 1.24 roll, 3.41 pitch
#   lmg_legsenergy200k_s43_2026-11-20_1449: roll +0.11 pitch -2.50 (4374 samples, 8.7 s); left +0.56 / -1.02, right
#     -0.34 / -3.99: the feet disagree by 0.90 roll, 2.97 pitch
# The bags differ by 0.31 roll and 0.38 pitch (the bar is 0.3), and in both the right sole sits ~3 deg more toe-down
# than the left by kinematics (the legs' pitch chains differ by 0.06 rad), so the "both soles flat" premise doesn't
# hold: an ankle encoder offset, uneven floor, or the hoist still carrying weight. Other references: the quaternion
# reads pitch -2.3 / roll -0.2 against the torso accelerometer, -3.2..-3.4 / -0.05..+0.2 against the head MID-360;
# the raw-IMU policies trained on an offset of roll -0.6..+0.4, pitch -3.6..-2.0. Every estimate is within 0.65 deg of
# roll +0.1, pitch -2.7, inside the +-1 deg error the calibrated policies train to tolerate (imu.residual_deg).
# It was to be re-measured on flat floor with the hoist slack (and the ankle zeros checked): the 11-23 stand above.
h12:
  roll_deg: 0.1
  pitch_deg: -2.2
  yaw_deg: 0.0
  rotate_gyro: false

# The H1-2's simulators (lmg_sim): RoboCasa's torso IMU is MuJoCo's own frame sensor (golem_robocasa's
# unitree_interface.py), the true attitude with no offset, so nothing is removed and the policy sees a level IMU.
h12_sim:
  roll_deg: 0.0
  pitch_deg: 0.0
  yaw_deg: 0.0
  rotate_gyro: false

g1: null
