# Each robot's torso-IMU (/lowstate imu_state) orientation calibration, keyed by the robot's policy folder name
# (policies/<robot>/), and each robot's simulators' as <robot>_sim. marl_deploy_node reads the entry its `robot`
# parameter names (default the policy folder's name; lmg_sim passes h12_sim) and passes it to
# MarlController(imu_calibration=...), which applies
# it only to a policy whose export.yaml has imu.orientation: calibrated; a raw policy (imu.orientation raw, or an
# older export with imu.quat_bias_deg) reads the IMU as reported, and the node logs that the calibration is ignored.
# A calibrated policy on a robot whose entry is null is refused at start.
#
#   roll_deg, pitch_deg, yaw_deg: what the quaternion reads (deg) with imu_link level: reported = true * R_bias,
#     R_bias = Rz(yaw) Ry(pitch) Rx(roll); pitch positive nose down, roll positive tilting right (Isaac's
#     quat_from_euler_xyz, as training's lowstate_imu.py). The deploy applies corrected = reported * R_bias^-1.
#   rotate_gyro: false (training biased the quaternion only: an estimator offset); true re-expresses the gyro (and
#     the specific force) in the level frame, for an offset that is a physical mounting tilt.
#
# Measure with calibrate_imu (README "IMU calibration"): both feet flat on level ground, still. Write the date, the
# method and each bag's numbers beside the value. Yaw is unobservable that way: leave it 0.

# H1-2: roll +1.0, pitch -1.7 (2026-11-24), calibrate_imu averaged over two 180-deg turned pairs. Valid only with
# the right ankle zero offsets set on its motor controller (Unitree app): motor 10 (right_ankle_pitch) -3.4, motor 11
# (right_ankle_roll) 4.7; re-measure after any re-zeroing. Before those offsets the right sole read ~3.4 deg toe-up and
# ~1.2 deg rolled against the left with both soles flat, so every earlier calibrate_imu estimate is biased.
# Method: pre-pose (waiting_confirm) on the feet, hoist taut (the pre-pose does not balance alone), 40 s of /lowstate
# still per recording, on one taped spot facing forward (A) and turned 180 deg (B); the floor there reads 0.1-0.2 deg
# front-high and 0.2-0.4 deg roll by phone level. A floor slope flips sign with the turn, so each pair's mean cancels
# it. Bags imucal_<name>_2026-11-24 (motor 11 at 5.0 in A3-B4, 4.7 in A5):
#   A3: roll +0.21 pitch -2.06 (4124 samples), feet disagree 0.41 roll, 0.04 pitch
#   B3: roll +1.17 pitch -1.42 (4122), feet 0.24 / 0.04
#   A4: roll +0.68 pitch -1.99 (4124), feet 0.26 / 0.09
#   B4: roll +1.27 pitch -1.41 (4124), feet 0.39 / 0.02
#   pair means: A3+B3 +0.69 / -1.74, A4+B4 +0.97 / -1.70 (they agree within 0.29 / 0.04); with motor 11's
#   4.7 (+0.3 deg on the right ankle roll) applied in the analysis, the mean is +0.98 / -1.69
#   A5 (motor 11 at 4.7): roll +0.53 pitch -1.98, feet 0.24 / 0.11; less the forward floor shift of the pairs
#   (-0.39 / -0.30): +0.92 / -1.68
# The torso accelerometer disagrees: the quaternion against it reads roll -0.2, pitch -2.35 in every bag, either way
# round (as on 2026-11-23), so floor-free the accelerometer and the leg kinematics differ by +1.0 roll, +0.65 pitch.
# An IMU board tilted on torso_link would do that (the likelier cause, unmeasured on the real H1-2), as would an
# offset shared by both legs, which a flat-footed stand cannot see. This value removes both the estimator's offset
# and a board tilt, so the policy sees torso_link's attitude. rotate_gyro stays false: about 1 deg of the offset
# would be a physical tilt, which leaves the gyro ~1 deg off its axes, and rotating it by the whole offset would
# over-rotate it by the estimator's ~2.4 deg.
h12:
  roll_deg: 1.0
  pitch_deg: -1.7
  yaw_deg: 0.0
  rotate_gyro: false

# The H1-2's simulators (lmg_sim): RoboCasa's torso IMU is MuJoCo's own frame sensor (golem_robocasa's
# unitree_interface.py), the true attitude with no offset, so nothing is removed and the policy sees a level IMU.
h12_sim:
  roll_deg: 0.0
  pitch_deg: 0.0
  yaw_deg: 0.0
  rotate_gyro: false

g1: null
