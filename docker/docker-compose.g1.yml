# The G1's overlay on docker-compose.yml. The simulator and stack wrappers add
# it when the selected robot is the G1 (--g1, or GOLEM_ROBOT=g1), never for the
# H1-2. It holds only what depends on the simulated robot: the RoboCasa
# service's robot and its G1-only knobs. The workspace service needs no overlay:
# every workspace container builds and runs both robots. The G1 sim builds its
# robot from CL_Assets/g1, which docker-compose.yml mounts for both robots.
#
# Empty knobs mean the sim's own default: SensorConfig in
# golem_robocasa/g1/g1_sensors.py for the sensors, g1/unitree_interface.py for
# the command timeout.
services:
  robocasa:
    environment:
      GOLEM_ROBOT: g1
      # s of sim time of rt/lowcmd silence after which the sim turns every
      # motor off (default 0.5). A value that is not finite and positive stops
      # the sim at startup.
      GOLEM_CMD_TIMEOUT: ${GOLEM_CMD_TIMEOUT:-}
      # 0 drops the MID-360 (/livox/lidar, /livox/imu).
      GOLEM_LIDAR: ${GOLEM_LIDAR:-}
      # Points per lidar frame (default 20,000, the real MID-360's).
      GOLEM_LIDAR_POINTS: ${GOLEM_LIDAR_POINTS:-}
      # Lidar frames per sim second (at most 100).
      GOLEM_LIDAR_HZ: ${GOLEM_LIDAR_HZ:-}
      # Head-camera frames per sim second.
      GOLEM_CAMERA_HZ: ${GOLEM_CAMERA_HZ:-}
