# G1 additions to docker-compose.yml; the host wrappers add this file for the G1
# (GOLEM_ROBOT=g1 or --g1) and never for the H1-2.
services:
  robocasa:
    environment:
      GOLEM_ROBOT: g1
      # The Unitree SDK in the sim takes the interface explicitly; empty = automatic.
      G1_DDS_INTERFACE: ${G1_DDS_INTERFACE:-}
      # Sim seconds of rt/lowcmd silence before the sim turns the motors off.
      # Empty = the sim's default (0.5); a value that is not finite and
      # positive stops the sim at startup. The H1-2 sim fails on an empty
      # GOLEM_CMD_TIMEOUT, so only this overlay sets it.
      GOLEM_CMD_TIMEOUT: ${GOLEM_CMD_TIMEOUT:-}
      # MID-360 and head-camera cost knobs; empty = the sim's default.
      # GOLEM_LIDAR=0 drops the lidar; GOLEM_LIDAR_POINTS is points per frame and
      # GOLEM_LIDAR_HZ / GOLEM_CAMERA_HZ are the publish rates.
      GOLEM_LIDAR: ${GOLEM_LIDAR:-}
      GOLEM_LIDAR_POINTS: ${GOLEM_LIDAR_POINTS:-}
      GOLEM_LIDAR_HZ: ${GOLEM_LIDAR_HZ:-}
      GOLEM_CAMERA_HZ: ${GOLEM_CAMERA_HZ:-}
      # Head-camera render scale of the real 1280x720.
      GOLEM_CAMERA_SCALE: ${GOLEM_CAMERA_SCALE:-1.0}
      # Metres the robot is backed off the spawn counter into open floor (see
      # h12_mujoco.py); empty = 0.
      GOLEM_SPAWN_BACKOFF: ${GOLEM_SPAWN_BACKOFF:-}
    volumes:
      # The G1 model the sim builds its robot from; the ros service mounts it
      # at the same path.
      - type: bind
        source: ../third_party/leprechaun_g1
        target: /home/code/third_party/leprechaun_g1
        read_only: true
        bind:
          create_host_path: false

  ros:
    environment:
      GOLEM_ROBOT: g1
      # The Unitree SDK ignores CYCLONEDDS_URI, so the nodes that use it read
      # the interface from here.
      G1_DDS_INTERFACE: ${G1_DDS_INTERFACE:-}
      # cyclonedds_local.xml, written from G1_DDS_INTERFACE by the host wrapper
      # when it starts this container (write_g1_dds_pin in docker_common.sh),
      # pins the network interface on top of the shared tuning file.
      CYCLONEDDS_URI: file:///home/code/cyclonedds.xml,file:///home/code/cyclonedds_local.xml
    volumes:
      # The walking policy's g1.yaml reads the G1's MJCF at
      # /home/code/third_party/leprechaun_g1; the walking node reads its policy
      # from /home/code/g1_locomotion.
      - type: bind
        source: ../third_party/leprechaun_g1
        target: /home/code/third_party/leprechaun_g1
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../core_ws/src/g1/g1_locomotion/policy
        target: /home/code/g1_locomotion
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${GOLEM_CACHE_DIR:-../container_cache}/cyclonedds_local.xml
        target: /home/code/cyclonedds_local.xml
        read_only: true
        bind:
          create_host_path: false
