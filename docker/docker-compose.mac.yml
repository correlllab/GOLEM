# The Mac (Apple Silicon) overlay on docker-compose.yml. docker_common.sh's
# configure_platform adds it when the platform is mac (Darwin on arm64, or
# GOLEM_PLATFORM=mac), never on Linux, so the x86 / NVIDIA services are as the
# base file declares them. It swaps the images for the arm64 builds of
# docker/mac/, drops the NVIDIA runtime, and sets the sims' CPU rendering.
# Container names, mounts and the host network are the base file's: on
# OrbStack or Docker Desktop (host networking on) both containers share the
# Linux VM's network, so DDS between them works; the macOS host is not on it,
# so ros2 and RViz run inside golem_ros. docs/MAC.md has the flow and what the
# Mac leaves out (the GPU vision models, Isaac).
#
# The colcon build trees (core_ws's build, install and log, and the sim's
# msgs_ws) live in Docker volumes on the VM's own disk, not in the checkout:
# every file a container writes through the VM's file sharing reaches the
# macOS host, and on a managed Mac whose endpoint security scans each one, a
# write costs ~180 ms (Colima, measured) against microseconds on the VM's
# disk; a cold core_ws build and stack start fell from over 40 min (the build
# alone, unfinished) to 2.5 min. Sources stay
# bind-mounted from the checkout. `docker volume rm golem_core_build` (and the
# others below) gives a clean build.
services:
  robocasa:
    volumes:
      # Replaces the base file's container_cache/msgs_ws bind (same target);
      # the message sources it binds into msgs_ws/src mount on top.
      - type: volume
        source: golem_msgs_ws
        target: /home/code/msgs_ws
    build:
      dockerfile: docker/mac/RobocasaDockerfile
    image: golem_sim_robocasa:arm64
    platform: linux/arm64
    # No NVIDIA GPU: the base file's runtime is removed (Compose >= 2.24).
    runtime: !reset null
    # 2 GB of /dev/shm: the base file's 16 GB exceeds a laptop VM's memory.
    shm_size: 2g
    environment:
      # gpu (the sims' default, an NVIDIA GPU over EGL) or cpu (OSMesa, the
      # MID-360 cast exactly on the CPU): golem_robocasa/sim_common.py. The
      # Mac has only cpu.
      GOLEM_RENDER: cpu
      # Both robots' MID-360 points per frame. configure_robot exports the
      # Mac's default per robot (6000 for the H1-2, 10000 for the G1: the
      # most each holds real time with on an 8-core M3, docs/MAC.md).
      GOLEM_LIDAR_POINTS: ${GOLEM_LIDAR_POINTS:-}
      # Software-rendered cameras cost the most per step: off unless asked for.
      GOLEM_CAMERAS: ${GOLEM_CAMERAS:-0}
  ros:
    build:
      dockerfile: docker/mac/RosDockerfile
    image: golem_ros:arm64
    platform: linux/arm64
    runtime: !reset null
    shm_size: 2g
    environment:
      # RViz draws on the Xvfb display docker/mac/vnc_display.sh starts, shown
      # at http://localhost:6080/vnc.html (docs/MAC.md); GOLEM_VNC=0 starts none.
      DISPLAY: ":99"
      GOLEM_VNC: ${GOLEM_VNC:-1}
      GOLEM_VNC_SIZE: ${GOLEM_VNC_SIZE:-1280x800}
      # Mesa's software OpenGL draws RViz on one thread: on every core it takes
      # about 1.5 of them and the stack falls below real time (docs/MAC.md).
      LP_NUM_THREADS: ${LP_NUM_THREADS:-1}
      # core_ws/cyclonedds.xml, then an override of its 16 MB minimum UDP
      # receive buffer: the minimum makes every ROS node fail to create its
      # domain unless the kernel's net.core.rmem_max allows it, which the
      # OrbStack / Docker Desktop VM does not by default (docs/DDS_TUNING.md
      # raises it on Linux hosts).
      CYCLONEDDS_URI: "file:///home/code/cyclonedds.xml,<CycloneDDS><Domain><Internal><SocketReceiveBufferSize min=\"default\"/></Internal></Domain></CycloneDDS>"
    volumes:
      # core_ws's colcon trees on the VM's disk (the header); the sources
      # under core_ws/src stay the base file's bind of the checkout.
      - type: volume
        source: golem_core_build
        target: /home/code/core_ws/build
      - type: volume
        source: golem_core_install
        target: /home/code/core_ws/install
      - type: volume
        source: golem_core_log
        target: /home/code/core_ws/log
# Fixed names, whatever the Compose project is called.
volumes:
  golem_msgs_ws:
    name: golem_msgs_ws
  golem_core_build:
    name: golem_core_build
  golem_core_install:
    name: golem_core_install
  golem_core_log:
    name: golem_core_log
