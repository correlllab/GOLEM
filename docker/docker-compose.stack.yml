# Selected by docker_stack.sh; shell launches keep their existing default.
services:
  ros:
    environment:
      GOLEM_WAIT_FOR_SIM: "1"
      GOLEM_SIM_TIMEOUT: ${GOLEM_SIM_TIMEOUT:-180}
    command:
      - /home/code/h12_sim_scripts/launch_ros.sh
      - ros2
      - launch
      - h1_bringup
      - h1_sim_bringup.launch.py
      - use_rviz:=${GOLEM_USE_RVIZ:-false}
