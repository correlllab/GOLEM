# The containers: the isaac and robocasa simulators and the ros
# workspace, one Compose profile each. Start them through
# docker/scripts/docker_run.sh or docker_stack.sh, which load docker/.env, check
# the DDS domain and the bind sources, and add the overlays:
# docker-compose.gui.yml (X11 desktop), docker-compose.g1.yml (the G1 sim),
# docker-compose.stack.yml (paired startup) and, when pinning CPUs,
# docker-compose.cpus-sim.yml and docker-compose.cpus-ros.yml (cpuset for
# robocasa and ros). Paths are relative to this directory; GOLEM_ASSETS_DIR and
# GOLEM_CACHE_DIR relocate the asset and cache mounts. Every bind source must exist (create_host_path: false); the wrappers
# create only the cache directories.
#
# All three run on the host network, so they share one DDS domain
# (ROS_DOMAIN_ID, 1 when unset; 0 is the real robots' bus).
services:
  # Isaac Lab simulator of the H1-2 (IsaacDockerfile, launch_isaac.sh).
  isaac:
    profiles: [isaac]
    container_name: golem_sim_isaac
    build:
      context: ..
      dockerfile: docker/IsaacDockerfile
    # No shell entrypoint, so command overrides run as given.
    entrypoint: []
    image: golem_sim_isaac:latest
    platform: linux/amd64
    init: true
    runtime: nvidia
    privileged: true
    shm_size: 16g
    network_mode: host
    stdin_open: true
    tty: true
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - QT_X11_NO_MITSHM=1
      - LIBGL_ALWAYS_INDIRECT=0
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-1}
    volumes:
      - type: bind
        source: ${GOLEM_ASSETS_DIR:-../CL_Assets}
        target: /home/code/CL_Assets
        read_only: true
        bind:
          create_host_path: false
      # The launchers and wait_for_sim.py, at the path every image's command uses.
      - type: bind
        source: ./scripts
        target: /home/code/h12_sim_scripts
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../CL_isaaclab_sim
        target: /home/code/CL_isaaclab_sim
        bind:
          create_host_path: false
      # Isaac Sim's shader, kernel and Kit caches, kept across containers
      # (prepare_mounts in docker_common.sh creates the host directories).
      - type: bind
        source: ${GOLEM_CACHE_DIR:-../container_cache}/isaac/ov
        target: /root/.cache/ov
        bind:
          create_host_path: false
      - type: bind
        source: ${GOLEM_CACHE_DIR:-../container_cache}/isaac/nvidia
        target: /root/.nv
        bind:
          create_host_path: false
      - type: bind
        source: ${GOLEM_CACHE_DIR:-../container_cache}/isaac/local_share_ov
        target: /root/.local/share/ov
        bind:
          create_host_path: false
      - type: bind
        source: ${GOLEM_CACHE_DIR:-../container_cache}/isaac/isaacsim
        target: /root/.isaacsim
        bind:
          create_host_path: false
    command: /home/code/h12_sim_scripts/launch_isaac.sh

  # RoboCasa / MuJoCo simulator of either robot (RobocasaDockerfile,
  # launch_robocasa.sh). The H1-2 unless docker-compose.g1.yml is added.
  robocasa:
    profiles: [robocasa]
    container_name: golem_sim_robocasa
    build:
      context: ..
      dockerfile: docker/RobocasaDockerfile
    image: golem_sim_robocasa:latest
    platform: linux/amd64
    init: true
    runtime: nvidia
    privileged: true
    shm_size: 16g
    network_mode: host
    stdin_open: true
    tty: true
    # The simulator knobs pass through from the host shell or docker/.env;
    # empty means the simulator's own default. The G1-only knobs are in
    # docker-compose.g1.yml.
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - QT_X11_NO_MITSHM=1
      - LIBGL_ALWAYS_INDIRECT=0
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-1}
      # H1-2: m of clearance between the robot and any non-floor geom at
      # spawn. Empty: the task's spawn_margin, else 0.20 (h12_mujoco.py).
      - GOLEM_SPAWN_MARGIN=${GOLEM_SPAWN_MARGIN:-}
      # Both robots: m the robot is backed off the spawn counter into open
      # floor, for walking and navigation. Empty: 0, at the counter.
      - GOLEM_SPAWN_BACKOFF=${GOLEM_SPAWN_BACKOFF:-}
      # H1-2: 0 keeps the robot's own links in its lidar scan as occluders.
      # Empty: they are filtered out (h12_mujoco.py).
      - GOLEM_LIDAR_SELF_FILTER=${GOLEM_LIDAR_SELF_FILTER:-}
      # Both robots: the target real-time factor, sim seconds per wall second
      # (golem_robocasa/sim_common.py). Empty: 1, real time; 2 twice real time;
      # max unpaced. Above 1 every ROS node gets less wall time per sim second.
      - GOLEM_SIM_RATE=${GOLEM_SIM_RATE:-}
      # Both robots: 0 drops every RGBD camera (the heaviest per-step cost).
      - GOLEM_CAMERAS=${GOLEM_CAMERAS:-}
      # Head camera size as a fraction of the real 1280x720 (default 0.5).
      - GOLEM_CAMERA_SCALE=${GOLEM_CAMERA_SCALE:-}
      # H1-2: 0 drops depth/image_rect_raw; 0 on GOLEM_CAMERA_POINTCLOUD drops
      # depth/color/points.
      - GOLEM_CAMERA_DEPTH=${GOLEM_CAMERA_DEPTH:-}
      - GOLEM_CAMERA_POINTCLOUD=${GOLEM_CAMERA_POINTCLOUD:-}
      # H1-2: <W>x<H> of both hand cameras (default 256x256).
      - GOLEM_HAND_CAMERA_RES=${GOLEM_HAND_CAMERA_RES:-}
      # 1 publishes ground-truth /odom and the odom -> pelvis TF. Ground truth
      # stays opt-in: no bringup uses it (CLAUDE.md §8).
      - GOLEM_SIM_ODOM=${GOLEM_SIM_ODOM:-0}
      # H1-2: "dx,dy", m in the world frame, added to the task's spawn.
      - GOLEM_SPAWN_OFFSET=${GOLEM_SPAWN_OFFSET:-}
    volumes:
      - type: bind
        source: ../golem_robocasa
        target: /home/code/golem_robocasa
        bind:
          create_host_path: false
      - type: bind
        source: ${GOLEM_ASSETS_DIR:-../CL_Assets}
        target: /home/code/CL_Assets
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./scripts
        target: /home/code/h12_sim_scripts
        read_only: true
        bind:
          create_host_path: false
      # msgs_ws: the only core_ws packages the simulator builds, the message
      # packages it serves. The workspace root is a host cache directory, so
      # colcon's build/install/log persist and an unchanged rebuild is a
      # no-op; the two package sources are mounted read-only inside it.
      - type: bind
        source: ${GOLEM_CACHE_DIR:-../container_cache}/msgs_ws
        target: /home/code/msgs_ws
        bind:
          create_host_path: false
      - type: bind
        source: ../core_ws/src/magpie_msgs
        target: /home/code/msgs_ws/src/magpie_msgs
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../core_ws/src/custom_ros_messages
        target: /home/code/msgs_ws/src/custom_ros_messages
        read_only: true
        bind:
          create_host_path: false
    command: /home/code/h12_sim_scripts/launch_robocasa.sh

  # The ROS 2 workspace of both robots (RosDockerfile). launch_ros.sh builds
  # core_ws and opens a shell; bringup is started by hand, or by
  # docker-compose.stack.yml.
  ros:
    profiles: [ros]
    container_name: golem_ros
    build:
      context: ..
      dockerfile: docker/RosDockerfile
    image: golem_ros:latest
    platform: linux/amd64
    init: true
    runtime: nvidia
    privileged: true
    shm_size: 16g
    network_mode: host
    stdin_open: true
    tty: true
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-1}
      # The CycloneDDS configuration mounted below: larger UDP receive buffers
      # so bursty camera and point-cloud traffic is not dropped. It only takes
      # effect once the host's net.core.rmem_max is raised (docs/DDS_TUNING.md).
      - CYCLONEDDS_URI=file:///home/code/cyclonedds.xml
      # Gemini API key for model_server's gemini_server and golem_skills.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # graspgen_server's checkpoints, which come with model_server's weights
      # through the core_ws mount (the image's default is an empty directory).
      - GRASPGENX_CHECKPOINT_DIR=/home/code/core_ws/src/model_server/weights/graspgen
      # graspgen_server's gripper assets root, into which the Magpie gripper is
      # mounted below.
      - GRASPGENX_ASSETS_DIR=/opt/graspgenx/assets
    volumes:
      - type: bind
        source: ../core_ws
        target: /home/code/core_ws
        bind:
          create_host_path: false
      # The CycloneDDS configuration (CYCLONEDDS_URI), read-only at a fixed
      # path, though core_ws is mounted too.
      - type: bind
        source: ../core_ws/cyclonedds.xml
        target: /home/code/cyclonedds.xml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${GOLEM_ASSETS_DIR:-../CL_Assets}
        target: /home/code/CL_Assets
        read_only: true
        bind:
          create_host_path: false
      # The Magpie gripper's GraspGenX description, so gripper_name=magpie
      # resolves. Only the leaf directories are mounted: mounting assets/ would
      # hide the image's proc_grippers/ and sample_data/. gripper.urdf refers to
      # ../meshes/magpie/, so the meshes go one level above the gripper
      # directory.
      - type: bind
        source: ${GOLEM_ASSETS_DIR:-../CL_Assets}/graspgenx/assets/magpie
        target: /opt/graspgenx/assets/x_grippers/magpie
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${GOLEM_ASSETS_DIR:-../CL_Assets}/graspgenx/assets/meshes/magpie
        target: /opt/graspgenx/assets/x_grippers/meshes/magpie
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./scripts
        target: /home/code/h12_sim_scripts
        read_only: true
        bind:
          create_host_path: false
      # The repo's tools/, for tools/read_lowstate.py
      # (docs/g1/first-session.md).
      - type: bind
        source: ../tools
        target: /home/code/tools
        read_only: true
        bind:
          create_host_path: false
    command: /home/code/h12_sim_scripts/launch_ros.sh
