# The Apple-Silicon (arm64, CPU-only) containers: the RoboCasa simulator of the
# H1-2 and the slim ROS workspace, run under Colima. A standalone file, not an
# overlay on docker/docker-compose.yml, so the NVIDIA runtime, GPU variables
# and X11 / device mounts of the x86 file are absent. There is no Isaac
# service. Start it through docker/mac/scripts/docker_stack_mac.sh (both
# services, the usual way) or docker_run_mac.sh (one); paths are relative to
# this directory.
#
# Both services share the host's network and IPC namespaces: ROS runs on
# FastDDS here, and FastDDS sends same-host data through shared memory, so with
# separate IPC namespaces discovery (UDP) would match while the data is
# dropped (the sim would never receive rt/lowcmd).
services:
  # The RoboCasa simulator (RobocasaDockerfile.arm64, launch_robocasa_mac.sh).
  robocasa:
    container_name: golem_sim_robocasa
    build:
      context: ../..
      dockerfile: docker/mac/RobocasaDockerfile.arm64
    image: golem_sim_robocasa:arm64
    platform: linux/arm64
    init: true
    shm_size: 8g
    network_mode: host
    ipc: host
    stdin_open: true
    tty: true
    environment:
      - MUJOCO_GL=osmesa
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-1}
      # headless (default): OSMesa offscreen rendering, no viewer. vnc: the
      # interactive viewer, rendered with llvmpipe into an in-container Xvfb
      # and served over noVNC on 6080 (docker/mac/scripts/mac_vnc_tunnel.sh);
      # a GL window cannot be forwarded to XQuartz on Apple Silicon.
      - GOLEM_DISPLAY=${GOLEM_DISPLAY:-headless}
      # 0 drops the three RGBD cameras, the heaviest per-step cost; lidar and
      # odometry are unaffected.
      - GOLEM_CAMERAS=${GOLEM_CAMERAS:-1}
      # Head camera size as a fraction of the real 1280x720 (empty: 0.5). 0 on
      # GOLEM_CAMERA_DEPTH drops depth/image_rect_raw; 0 on
      # GOLEM_CAMERA_POINTCLOUD drops depth/color/points.
      - GOLEM_CAMERA_SCALE=${GOLEM_CAMERA_SCALE:-}
      - GOLEM_CAMERA_DEPTH=${GOLEM_CAMERA_DEPTH:-}
      - GOLEM_CAMERA_POINTCLOUD=${GOLEM_CAMERA_POINTCLOUD:-}
      # s of sim time of rt/lowcmd silence after which the sim turns every
      # motor off.
      - GOLEM_CMD_TIMEOUT=${GOLEM_CMD_TIMEOUT:-0.5}
      # 1 publishes ground-truth /odom and the odom -> pelvis TF. Off by
      # default: ground truth is opt-in, and the workspace's navigation
      # (GOLEM_SLAM / GOLEM_NAV2) runs on FAST-LIO, whose TF already parents
      # pelvis.
      - GOLEM_SIM_ODOM=${GOLEM_SIM_ODOM:-0}
      # m the robot is backed off the counter into open floor at spawn (0: at
      # the counter, for manipulation). 1.5-2.0 gives Nav2 room to plan and
      # keeps a standing policy from leaning into a counter. The value is set
      # when the container is created: change it with `up --force-recreate`,
      # not `restart`.
      - GOLEM_SPAWN_BACKOFF=${GOLEM_SPAWN_BACKOFF:-0}
      # m of clearance between the robot and any non-floor geom at spawn.
      # Empty: the task's spawn_margin, else 0.20 (h12_mujoco.py).
      - GOLEM_SPAWN_MARGIN=${GOLEM_SPAWN_MARGIN:-}
      # rclpy on FastDDS, so the sim process does not load a second CycloneDDS
      # beside unitree_sdk2py's (RobocasaDockerfile.arm64 has the reason).
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
    volumes:
      - type: bind
        source: ../../golem_robocasa
        target: /home/code/golem_robocasa
        bind:
          create_host_path: false
      - type: bind
        source: ${GOLEM_ASSETS_DIR:-../../CL_Assets}
        target: /home/code/CL_Assets
        read_only: true
        bind:
          create_host_path: false
      # The Mac launchers, at the path the image's command uses.
      - type: bind
        source: ./scripts
        target: /home/code/h12_sim_scripts
        read_only: true
        bind:
          create_host_path: false
      # The shared scripts (runtime_common.sh, wait_for_sim.py).
      - type: bind
        source: ../scripts
        target: /home/code/golem_common
        read_only: true
        bind:
          create_host_path: false
      # msgs_ws: the message packages the simulator builds; the sources are
      # mounted read-only.
      - type: bind
        source: ${GOLEM_CACHE_DIR:-../../container_cache}/msgs_ws
        target: /home/code/msgs_ws
        bind:
          create_host_path: false
      - type: bind
        source: ../../core_ws/src/magpie_msgs
        target: /home/code/msgs_ws/src/magpie_msgs
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../../core_ws/src/custom_ros_messages
        target: /home/code/msgs_ws/src/custom_ros_messages
        read_only: true
        bind:
          create_host_path: false
      # colcon's build and install trees on named volumes, on the VM's own
      # disk: a --symlink-install tree written onto the virtiofs bind mount
      # stalls for minutes. The volumes persist, so rebuilds are incremental.
      - msgs_build:/opt/msgs_ws/build
      - msgs_install:/opt/msgs_ws/install
    command: /home/code/h12_sim_scripts/launch_robocasa_mac.sh

  # The slim ROS workspace (RosDockerfile.slim.arm64). launch_ros_mac.sh builds
  # the Mac's packages and starts h12_sim_mac.launch.py.
  ros:
    container_name: golem_ros
    build:
      context: ../..
      dockerfile: docker/mac/RosDockerfile.slim.arm64
    image: golem_ros:arm64
    platform: linux/arm64
    init: true
    shm_size: 4g
    network_mode: host
    ipc: host
    stdin_open: true
    tty: true
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-1}
      # FastDDS, as in the simulator.
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      # vnc (or 1) also runs RViz2, rendered with llvmpipe into its own Xvfb
      # and served over noVNC on 6081, apart from the MuJoCo viewer's 6080.
      - GOLEM_RVIZ=${GOLEM_RVIZ:-0}
      # The leg block of h12_sim_mac.launch.py: fame, walk or almi starts
      # golem_lowerbody_rl's controller pinned to that policy, which pre-poses
      # the legs and then releases the elastic band. fame stands only; walk
      # and almi follow /cmd_vel, and almi also stands (the one for
      # navigation). Empty: no leg controller, the band holds the robot; any
      # other value stops the bringup.
      - GOLEM_LOWERBODY=${GOLEM_LOWERBODY:-}
      # 1 (true, on) on either one starts golem_slam's navigation graph for
      # the H1-2: FAST-LIO odometry, the self filter, OctoMap, slam_toolbox
      # and Nav2, which drives /cmd_vel. Goals: RViz's "2D Nav Goal" or
      # /navigate_to_pose.
      - GOLEM_SLAM=${GOLEM_SLAM:-0}
      - GOLEM_NAV2=${GOLEM_NAV2:-0}
      # 1 starts tools/ros_mcp_server.py, the ROS debugging MCP server, on
      # localhost:GOLEM_ROS_MCP_PORT; reach it from the Mac through
      # mac_vnc_tunnel.sh.
      - GOLEM_ROS_MCP=${GOLEM_ROS_MCP:-0}
      - GOLEM_ROS_MCP_PORT=${GOLEM_ROS_MCP_PORT:-6082}
    volumes:
      - type: bind
        source: ../../core_ws
        target: /home/code/core_ws
        bind:
          create_host_path: false
      - type: bind
        source: ${GOLEM_ASSETS_DIR:-../../CL_Assets}
        target: /home/code/CL_Assets
        read_only: true
        bind:
          create_host_path: false
      # golem_ros2_models' setup.py finds CL_Assets at ../../../CL_Assets from
      # its own path, and colcon runs it from the build base,
      # /opt/core_ws/build, so it looks in /opt/CL_Assets. The installed files
      # are copies, so nothing reads this mount at runtime.
      - type: bind
        source: ${GOLEM_ASSETS_DIR:-../../CL_Assets}
        target: /opt/CL_Assets
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./scripts
        target: /home/code/h12_sim_scripts
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../scripts
        target: /home/code/golem_common
        read_only: true
        bind:
          create_host_path: false
      # The repo's tools/, for the MCP server (GOLEM_ROS_MCP=1).
      - type: bind
        source: ../../tools
        target: /home/code/tools
        read_only: true
        bind:
          create_host_path: false
      # colcon's build and install trees on named volumes (see the simulator's).
      - core_ws_build:/opt/core_ws/build
      - core_ws_install:/opt/core_ws/install
    command: /home/code/h12_sim_scripts/launch_ros_mac.sh

# Named volumes live on the Colima VM's own disk: fast for --symlink-install
# trees, and kept across up / run cycles.
volumes:
  msgs_build:
  msgs_install:
  core_ws_build:
  core_ws_install:
